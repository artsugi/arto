<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#F3F5FA">
<title>Arto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #F3F5FA; --card: #FFFFFF; --bg-2: #E9EDF5; --line: #E4E8F0;
    --blue: #2447C6; --blue-2: #1C389E; --blue-soft: #E3E9FA;
    --red: #E5222B; --red-soft: #FDE1E2; --red-ink: #BD1720;
    --sky: #75B9E7; --sky-soft: #E3F1FB; --sky-ink: #23679A;
    --ink: #24304A; --muted: #5B6578;
    --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: only light;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  [hidden] { display: none !important; }
  .app { max-width: 440px; margin: 0 auto; padding: 16px 18px 118px; }

  .top { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--blue); overflow: hidden; flex-shrink: 0; }
  .hello { flex: 1; min-width: 0; }
  .hello b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .hello span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex-shrink: 0; color: var(--muted); }
  .icon-btn svg { width: 20px; height: 20px; }
  .sync { display: inline-flex; align-items: center; gap: 5px; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .page { display: none; }
  .page.on { display: block; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .title { margin: 20px 2px 0; font-size: 26px; font-weight: 800; font-style: italic; letter-spacing: -0.03em; color: var(--blue); }
  .sec { margin: 26px 2px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec h2 { margin: 0; font-size: 16.5px; font-weight: 800; }
  .sec span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .link { font-size: 13.5px; font-weight: 700; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }

  .hero { margin-top: 16px; background: var(--blue); color: #fff; border-radius: 28px; padding: 22px; }
  .hero .cap { font-size: 14px; font-weight: 700; font-style: italic; color: #D7DEFB; }
  .hero .big { font-size: clamp(30px, 10vw, 40px); font-weight: 800; line-height: 1.08; margin-top: 2px; white-space: nowrap; }
  .hero .sub { margin-top: 6px; font-size: 13.5px; color: #E3E8FC; font-weight: 500; }
  .flow3 { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .total-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.18); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13.5px; color: #E3E8FC; font-weight: 600; }
  .total-row b { font-size: 17px; font-weight: 800; color: #fff; white-space: nowrap; }
  .fb { background: rgba(255,255,255,.1); border-radius: 16px; padding: 10px 12px; }
  .fb small { display: block; font-size: 12.5px; color: #D7DEFB; font-weight: 600; }
  .fb b { font-size: 15px; font-weight: 800; white-space: nowrap; }

  .wallets { display: flex; gap: 10px; overflow-x: auto; margin: 0 -18px; padding: 2px 18px 4px; scrollbar-width: none; }
  .wallets::-webkit-scrollbar { display: none; }
  .wcard { flex: 0 0 auto; min-width: 140px; background: var(--card); border-radius: 20px; padding: 14px 16px; text-align: left; }
  .wcard small { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .wcard small svg { width: 15px; height: 15px; }
  .wcard b { display: block; margin-top: 6px; font-size: 17px; font-weight: 800; white-space: nowrap; }
  .wcard.add { min-width: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--blue); font-weight: 800; font-size: 13.5px; border: 1.5px dashed #B9C5EC; background: transparent; }
  .wcard.add svg { width: 20px; height: 20px; }

  .pk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pk { background: var(--card); border-radius: 24px; padding: 16px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 156px; }
  .pk.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 0; }
  .pk-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .pk-name { font-size: 14px; font-weight: 800; font-style: italic; display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .pk-val { font-size: clamp(17px, 5.2vw, 21px); font-weight: 800; line-height: 1.1; white-space: nowrap; }
  .pk-sub { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 3px; }
  .ring { position: relative; flex-shrink: 0; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; }

  .list { background: var(--card); border-radius: 24px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 66px; width: 100%; text-align: left; }
  .row + .row { border-top: 1px solid var(--line); }
  button.row:active { background: var(--bg-2); }
  .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; }
  .ico svg { width: 20px; height: 20px; }
  .ico.b { background: var(--blue-soft); color: var(--blue); }
  .ico.r { background: var(--red-soft); color: var(--red-ink); }
  .ico.s { background: var(--sky-soft); color: var(--sky-ink); }
  .ico.g { background: var(--bg-2); color: var(--ink); }
  .ico.in { background: var(--blue); color: #fff; }
  .grow { flex: 1; min-width: 0; }
  .t1 { display: block; font-weight: 700; font-size: 15px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t2 { display: block; font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-weight: 800; font-size: 15px; text-align: right; white-space: nowrap; }
  .amt.pos { color: var(--blue-2); }
  .tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 8px; background: var(--bg-2); color: var(--muted); }
  .tag.soon { background: var(--ink); color: #fff; }
  .tag.late { background: var(--red-soft); color: var(--red-ink); }
  .pay { height: 38px; padding: 0 14px; border-radius: 19px; background: var(--blue); color: #fff; font-weight: 800; font-size: 13.5px; flex-shrink: 0; }
  .ghost { height: 38px; padding: 0 14px; border-radius: 19px; background: var(--bg-2); font-weight: 800; font-size: 13.5px; flex-shrink: 0; }
  .empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .start { background: var(--card); border-radius: 24px; padding: 20px; text-align: center; }
  .start b { display: block; font-size: 17px; font-weight: 800; }
  .start p { margin: 6px 0 16px; color: var(--muted); font-size: 14px; }

  .pending { margin-top: 12px; background: var(--card); border-radius: 22px; padding: 14px 16px; border: 1.5px solid #C9D4F6; }
  .pending .row { padding: 8px 0; min-height: 0; }
  .pending .row + .row { border-top: 1px solid var(--line); }
  .pending h3 { margin: 0 0 4px; font-size: 14px; font-weight: 800; color: var(--blue); font-style: italic; }

  .lead { margin-top: 14px; border-radius: 28px; padding: 20px; display: flex; align-items: center; gap: 16px; }
  .lead.blue { background: var(--blue); color: #fff; }
  .lead.red { background: var(--red-soft); }
  .lead.plain { background: var(--card); }
  .lead .cap { font-size: 13.5px; font-weight: 600; opacity: .88; }
  .lead .big { font-size: clamp(22px, 7vw, 30px); font-weight: 800; line-height: 1.08; margin-top: 2px; white-space: nowrap; }
  .lead .sub { font-size: 13.5px; font-weight: 600; margin-top: 6px; opacity: .92; }
  .lead.plain .cap, .lead.plain .sub { color: var(--muted); opacity: 1; }
  .stats { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border-radius: 18px; padding: 12px; }
  .stat small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .stat b { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .note { margin-top: 10px; border-radius: 18px; padding: 12px 14px; font-size: 14px; font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }
  .note svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
  .note.good { background: var(--blue-soft); color: var(--blue-2); }
  .note.warn { background: var(--red-soft); color: var(--red-ink); }
  .bar-btn { margin-top: 10px; width: 100%; height: 46px; border-radius: 16px; background: var(--card); font-weight: 800; font-size: 14px; color: var(--blue); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .bar-btn svg { width: 18px; height: 18px; }
  .rep-btns { margin-top: 10px; display: flex; gap: 8px; }
  .rep-btns .bar-btn { margin-top: 0; flex: 1; }
  .bar-btn.main { background: var(--blue); color: #fff; }

  .top-list { background: var(--card); border-radius: 24px; padding: 6px 16px; }
  .tl { padding: 11px 0; }
  .tl + .tl { border-top: 1px solid var(--line); }
  .tl-head { display: flex; align-items: center; gap: 10px; }
  .tl-head .ico { width: 34px; height: 34px; border-radius: 11px; }
  .tl-head .ico svg { width: 17px; height: 17px; }
  .tl-name { flex: 1; min-width: 0; font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-name small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .tl-amt { font-weight: 800; font-size: 14.5px; white-space: nowrap; text-align: right; }
  .tl-amt small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .tl-bar { margin: 8px 0 0 44px; height: 7px; border-radius: 4px; background: var(--bg-2); overflow: hidden; }
  .tl-bar i { display: block; height: 100%; border-radius: 4px; }
  .split { background: var(--card); border-radius: 24px; padding: 16px; }
  .split-bar { height: 14px; border-radius: 7px; overflow: hidden; display: flex; gap: 2px; }
  .split-leg { margin-top: 12px; display: grid; gap: 8px; }
  .split-leg div { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .split-leg i { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .split-leg span { flex: 1; font-weight: 600; }
  .split-leg b { font-weight: 800; white-space: nowrap; }
  .split-leg em { font-style: normal; color: var(--muted); font-weight: 700; font-size: 13px; width: 40px; text-align: right; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 42px; padding: 0 14px; border-radius: 21px; background: var(--card); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .chip svg { width: 17px; height: 17px; flex-shrink: 0; }
  .chip.two { height: auto; min-height: 50px; padding: 6px 16px 6px 14px; border-radius: 18px; }
  .chip-txt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; text-align: left; }
  .chip-txt small { font-size: 12px; font-weight: 600; opacity: .72; margin-top: 1px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .goal { background: var(--card); border-radius: 22px; padding: 16px; }
  .goal + .goal { margin-top: 10px; }
  .goal-top { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .gbar { margin-top: 12px; height: 8px; border-radius: 5px; background: var(--sky-soft); overflow: hidden; }
  .gbar i { display: block; height: 100%; background: var(--sky); border-radius: 5px; }
  .goal-foot { margin-top: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .goal-btns { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gbtn { height: 42px; border-radius: 14px; font-weight: 800; font-size: 14px; background: var(--card); border: 1.5px solid var(--line); }
  .gbtn.main { background: var(--ink); color: #fff; border-color: var(--ink); }

  .mnav { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
  .mbtn { width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex-shrink: 0; }
  .mbtn svg { width: 18px; height: 18px; }
  .mbtn:disabled { opacity: .3; }
  .mlabel { flex: 1; height: 46px; border-radius: 23px; background: var(--card); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .mlabel b { font-size: 15.5px; font-weight: 800; }
  .now { font-size: 12px; font-weight: 800; color: var(--blue); background: var(--blue-soft); border-radius: 10px; padding: 2px 8px; }
  .ledger { margin-top: 10px; background: var(--card); border-radius: 24px; padding: 6px 16px; }
  .lg { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; font-size: 14.5px; }
  .lg + .lg { border-top: 1px solid var(--line); }
  .lg span { color: var(--muted); font-weight: 600; }
  .lg b { font-weight: 800; white-space: nowrap; }
  .lg.total span, .lg.total b { color: var(--ink); font-size: 16px; font-weight: 800; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--card); padding: 4px; border-radius: 18px; margin-top: 18px; }
  .seg button { height: 40px; border-radius: 14px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .day { margin: 18px 4px 8px; display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700; color: var(--muted); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 10px); pointer-events: none; }
  .nav-in { pointer-events: auto; max-width: 440px; margin: 0 auto; background: var(--card); border-radius: 26px; padding: 6px; display: grid; grid-template-columns: 1fr 1fr 74px 1fr 1fr; align-items: center; box-shadow: 0 12px 30px -14px rgba(36,48,74,.35); border: 1px solid var(--line); }
  .nav .tab { height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .nav .tab svg { width: 22px; height: 22px; }
  .nav .tab[aria-current="page"] { color: var(--blue); background: var(--blue-soft); }
  .plus { justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; margin-top: -28px; box-shadow: 0 10px 20px -8px rgba(229,34,43,.6); border: 4px solid var(--card); }
  .plus svg { width: 26px; height: 26px; }

  .scrim { position: fixed; left: 0; right: 0; z-index: 40; background: rgba(36,48,74,.45); display: flex; align-items: flex-end; justify-content: center; padding: 10px; }
  .sheet { width: 100%; max-width: 440px; overflow-y: auto; background: var(--card); border-radius: 30px; padding: 10px 20px 20px; animation: up .24s cubic-bezier(.2,1.1,.4,1); }
  @keyframes up { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sh-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sh-head h3 { margin: 0; flex: 1; font-size: 19px; font-weight: 800; font-style: italic; color: var(--blue); }
  .back { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; }
  .back svg { width: 16px; height: 16px; }
  .kind { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg-2); padding: 4px; border-radius: 18px; }
  .kind button { height: 42px; border-radius: 14px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
  .kind button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(36,48,74,.15); }
  .field { margin-top: 16px; }
  .field > label, .field > .lbl { display: block; font-size: 13.5px; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
  .money { display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 18px; border-radius: 20px; background: var(--bg-2); }
  .money span { font-weight: 800; font-size: 20px; color: var(--muted); }
  .money input { flex: 1; min-width: 0; border: 0; background: transparent; font-weight: 800; font-size: 28px; outline: none; letter-spacing: -0.02em; }
  .text, .sel { width: 100%; height: 50px; padding: 0 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); outline: none; }
  .text:focus, .sel:focus { border-color: var(--blue); }
  .sheet .chip { background: var(--bg-2); }
  .sheet .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .hint { margin: 6px 2px 0; font-size: 13px; color: var(--muted); font-weight: 500; }
  .err { margin: 10px 2px 0; font-size: 13.5px; color: var(--red-ink); font-weight: 700; }
  .save { margin-top: 18px; width: 100%; height: 56px; border-radius: 20px; background: var(--blue); color: #fff; font-weight: 800; font-size: 16px; }
  .save:disabled { opacity: .45; }
  .del { margin-top: 8px; width: 100%; height: 48px; border-radius: 16px; color: var(--red-ink); font-weight: 800; font-size: 14.5px; }
  .toggle { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--bg-2); border-radius: 18px; padding: 12px 14px; }
  .sw { width: 48px; height: 28px; border-radius: 14px; padding: 3px; background: #C3CAD8; transition: background .15s; flex-shrink: 0; }
  .sw i { display: block; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle[aria-checked="true"] .sw { background: var(--blue); }
  .toggle[aria-checked="true"] .sw i { transform: translateX(20px); }
  .set-group { background: var(--bg-2); border-radius: 20px; overflow: hidden; }
  .set-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; min-height: 58px; }
  .set-row + .set-row { border-top: 1px solid #DCE1EB; }
  .set-row .chev { color: var(--muted); }
  .set-row .chev svg { width: 14px; height: 14px; }
  .sum-box { background: var(--bg-2); border-radius: 20px; padding: 14px 16px; }
  .sum-box small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  .sum-box b { display: block; font-size: 24px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
  .sum-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sum-row .sum-box b { font-size: 18px; }
  .set-label { margin: 18px 4px 8px; font-size: 13px; font-weight: 800; color: var(--muted); }

  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: 0 auto; width: 100%; }

function writeChanges(changes) {
  const copy=x=>x==null?null:JSON.parse(JSON.stringify(x));
  const before=changes.map(c=>({col:c.col,id:c.id,doc:copy(S[c.col].find(x=>x.id===c.id)||null)}));
  const apply=list=>{list.forEach(c=>{const a=S[c.col],i=a.findIndex(x=>x.id===c.id);if(c.doc){if(i<0)a.push(copy(c.doc));else a[i]=copy(c.doc);}else if(i>=0)a.splice(i,1);});categoryCache=null;cache();};
  let batch=null;
  if(cloud.user&&db){batch=db.batch();changes.forEach(c=>{const ref=db.collection(c.col).doc(c.id);if(c.doc)batch.set(ref,strip(c.doc));else batch.delete(ref);});}
  apply(changes);
  let failed=false;
  if(batch)batch.commit().catch(e=>{
    failed=true;console.error(e);
    // Do not overwrite a newer local edit when rolling back a rejected write.
    apply(before.filter((c,i)=>JSON.stringify(S[c.col].find(x=>x.id===c.id)||null)===JSON.stringify(changes[i].doc||null)));
    render();toast('Perubahan gagal disimpan. Periksa koneksi dan izin data.',null,true);
  });
  return ()=>{if(!failed)writeChanges(before);};
}

function ring(pct, color, track, size, stroke, label) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><b>${label}</b></div>`;
}

// ================= Baris =================
const dueDate = (b, m) => m + '-' + pad2(dueDayIn(b, m));
const daysBetween = (a, b) => { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); };
const SOON_DAYS = 10;
// Tagihan bulan ini & bulan depan yang jatuh tempo dalam 10 hari ke depan (belum dibayar)
function upcomingBills(days) {
  const t = todayISO(), cm = curMonth(), out = [];
  [cm, shiftM(cm, 1)].forEach(m => S.bills.forEach(b => {
    if (!billDue(b, m) || billPaid(b, m)) return;
    const d = daysBetween(t, dueDate(b, m));
    if (d >= 0 && d <= days) {const status=billState(b,m);out.push({ b, m, d, status, remaining:status.remaining });}
  }));
  return out.sort((a, c) => a.d - c.d);
}
function dueTag(o) {
  const cm = curMonth();
  if (o.m < cm) return '<span class="tag late">Sisa tagihan '+mLabel(o.m)+'</span>';
  const d = daysBetween(todayISO(), dueDate(o.b, o.m));
  if (d < 0) return '<span class="tag late">Lewat jatuh tempo</span>';
  if (d <= 2) return `<span class="tag soon">${d === 0 ? 'Hari ini' : d === 1 ? 'Besok' : '2 hari lagi'}</span>`;
  if (d <= SOON_DAYS) return `<span class="tag">${d} hari lagi, ${dueDayIn(o.b, o.m)} ${mShort(o.m)}</span>`;
  return `<span class="tag">Tanggal ${dueDayIn(o.b, o.m)}${o.m !== cm ? ' ' + mShort(o.m) : ''}</span>`;
}
const billRow=o=>{const st=o.status||billState(o.b,o.m);return `<div class="row bill-item"><span class="ico b">${svg('receipt')}</span>
  <span class="grow"><span class="t1">${esc(o.b.name)}</span><span class="bill-balance num">${st.estimated?'Perkiraan ':st.partial?'Sisa ':''}${rp(st.remaining)}</span>
  ${st.partial?`<span class="t2 bill-detail">Total ${rp(st.total)}<br>Sudah dibayar ${rp(st.paid)}</span><span class="tag partial">Dibayar sebagian</span>`:''}${dueTag(o)}</span>
  <button class="pay" data-pay="${esc(o.b.id)}" data-m="${o.m}">${st.partial?'Bayar sisa':'Bayar'}</button></div>`;};

const TT = { in: ['in', 'inArrow', 'Uang masuk'], bill: ['b', 'receipt', 'Pokok bulanan'], harian: ['r', null, 'Harian'], other: ['g', 'bolt', 'Tak terduga'], save: ['s', 'jar', 'Ke tabungan'], withdraw: ['s', 'jar', 'Dari tabungan'], transfer: ['g', 'swap', 'Pindah dompet'], adjust: ['g', 'scale', 'Penyesuaian saldo'] };
function txRow(x) {
  const expense = isExpense(x), c = expense ? categoryOf(x) : null;
  const [oldClass, oldIcon, label] = TT[x.type] || TT.other;
  const cls = expense ? (x.type === 'bill' ? 'b' : 'r') : oldClass;
  const icon = expense ? c.icon : oldIcon;
  let sub = expense ? c.name + ' - ' + walletName(x.wallet) : label + ' - ' + walletName(x.wallet);
  if (x.type === 'transfer') sub = walletName(x.wallet) + ' ke ' + walletName(x.toWallet);
  if (x.type === 'save' || x.type === 'withdraw') sub = label + ' - ' + walletName(x.wallet);
  sub += ' - ' + dShort(x.date);
  const sign = x.type === 'in' || x.type === 'withdraw' ? '+' : x.type === 'transfer' ? '' : x.type === 'adjust' ? (x.amount >= 0 ? '+' : '\u2212') : '\u2212';
  return `<button class="row tx-edit" data-edit="${esc(x.id)}" aria-label="Ubah ${esc(x.name)}, ${esc(rp(x.amount))}, ${esc(dShort(x.date))}">
    <span class="ico ${cls}">${svg(icon || 'dots')}</span><span class="grow"><span class="t1">${esc(x.name)}</span><span class="t2">${esc(sub)}</span></span>
    <span class="amt num ${sign === '+' ? 'pos' : ''}">${sign}${fmt(x.amount)}<span class="edit-hint">Ubah</span></span></button>`;
}

const byDate = arr => arr.slice().sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
function groupByDay(arr, extra) {
  const g = {}; byDate(arr).forEach(x => { (g[x.date] = g[x.date] || []).push(x); });
  return Object.keys(g).sort().reverse().map(d => `<div class="day"><span>${dateLabel(d)}</span>${extra ? extra(g[d]) : ''}</div><div class="list">${g[d].map(txRow).join('')}</div>`).join('');
}

let activeDropdown = null;

function enhanceDropdowns(root) {
  root.querySelectorAll('select[data-artoselect]').forEach(select=>{
    if(select.dataset.enhanced)return;
    select.dataset.enhanced='true';
    const wrap=document.createElement('div');wrap.className='arto-dropdown';
    select.before(wrap);wrap.append(select);select.hidden=true;
    const trigger=document.createElement('button');trigger.type='button';trigger.className='dd-trigger';trigger.id=select.id+'-trigger';
    trigger.setAttribute('role','combobox');trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
    const label=root.querySelector('label[for="'+select.id+'"]');
    const name=select.getAttribute('aria-label')||(label&&label.textContent.trim())||'Pilih';
    trigger.setAttribute('aria-label',name);
    if(label)label.htmlFor=trigger.id;
    wrap.append(trigger);
    const opts=()=>Array.from(select.options);
    const content=option=>`<span class="dd-symbol">${svg(option.dataset.icon||select.dataset.icon||'receipt')}</span><span class="dd-copy"><b>${esc(option.textContent)}</b>${option.dataset.sub?`<small class="num">${esc(option.dataset.sub)}</small>`:''}</span>`;
    const refresh=()=>{
      const option=select.selectedOptions[0]||select.options[0];
      trigger.innerHTML=(option?content(option):'<span class="dd-copy"><b>Pilih</b></span>')+`<span class="dd-arrow">${svg('down')}</span>`;
      trigger.setAttribute('aria-label',name+': '+(option?option.textContent:'Pilih')+(option&&option.dataset.sub?', '+option.dataset.sub:''));
      trigger.disabled=select.disabled;
    };
    let menu=null,activeIndex=-1,search='',searchTimer;
    const place=()=>{
      if(!menu)return;
      if(!trigger.isConnected){close(false);return;}
      const rect=trigger.getBoundingClientRect(),v=window.visualViewport;
      const top=v?v.offsetTop:0,height=v?v.height:innerHeight,width=v?v.width:innerWidth,left=v?v.offsetLeft:0;
      if(rect.bottom<top+8||rect.top>top+height-8){close(false);return;}
      const below=top+height-rect.bottom-14,above=rect.top-top-14;
      const up=below<180&&above>below,space=Math.max(60,up?above:below),max=Math.min(270,space);
      menu.style.width=Math.min(rect.width,width-20)+'px';menu.style.maxHeight=max+'px';
      menu.style.left=Math.max(left+10,Math.min(rect.left,left+width-menu.offsetWidth-10))+'px';
      menu.style.top=(up?Math.max(top+10,rect.top-menu.offsetHeight-7):rect.bottom+7)+'px';
    };
    const close=(focus=false)=>{
      if(menu){menu.remove();menu=null;}
      trigger.setAttribute('aria-expanded','false');trigger.removeAttribute('aria-controls');trigger.removeAttribute('aria-activedescendant');
      document.removeEventListener('scroll',place,true);window.removeEventListener('resize',place);
      if(window.visualViewport){visualViewport.removeEventListener('resize',place);visualViewport.removeEventListener('scroll',place);}
      clearTimeout(searchTimer);search='';
      if(activeDropdown&&activeDropdown.trigger===trigger)activeDropdown=null;
      if(focus&&trigger.isConnected)trigger.focus({preventScroll:true});
    };
    const highlight=i=>{
      const options=opts();if(!menu||!options.length)return;
      activeIndex=Math.max(0,Math.min(options.length-1,i));
      menu.querySelectorAll('[role="option"]').forEach((el,index)=>el.classList.toggle('is-active',index===activeIndex));
      const row=menu.children[activeIndex];
      trigger.setAttribute('aria-activedescendant',row.id);
      // Scroll the options only, never the underlying transaction form.
      if(row.offsetTop<menu.scrollTop)menu.scrollTop=row.offsetTop;
      else if(row.offsetTop+row.offsetHeight>menu.scrollTop+menu.clientHeight)menu.scrollTop=row.offsetTop+row.offsetHeight-menu.clientHeight;
    };
    const choose=i=>{
      const option=opts()[i];if(!option||option.disabled)return;
      select.value=option.value;refresh();close(true);
      select.dispatchEvent(new Event('change',{bubbles:true}));
    };
    const open=()=>{
      if(menu||trigger.disabled)return;
      closeDropdown(false);refresh();
      menu=document.createElement('div');menu.className='dd-menu';menu.id=select.id+'-options';menu.setAttribute('role','listbox');menu.setAttribute('aria-label',name);
      menu.innerHTML=opts().map((o,i)=>`<div class="dd-option" id="${select.id}-option-${i}" role="option" aria-selected="${o.selected}" aria-disabled="${o.disabled}" data-option-index="${i}">${content(o)}<span class="dd-check">${svg('tick',2.5)}</span></div>`).join('');
      root.append(menu);
      trigger.setAttribute('aria-expanded','true');trigger.setAttribute('aria-controls',menu.id);
      activeDropdown={trigger,menu,close};
      menu.addEventListener('mousedown',e=>e.preventDefault());
      menu.addEventListener('click',e=>{const row=e.target.closest('[data-option-index]');if(row)choose(Number(row.dataset.optionIndex));});
      place();highlight(select.selectedIndex>=0?select.selectedIndex:0);
      document.addEventListener('scroll',place,true);window.addEventListener('resize',place);
      if(window.visualViewport){visualViewport.addEventListener('resize',place);visualViewport.addEventListener('scroll',place);}
    };
    trigger.onclick=()=>menu?close(true):open();
    trigger.addEventListener('keydown',e=>{
      if(['ArrowDown','ArrowUp','Home','End','Enter',' '].includes(e.key)){
        e.preventDefault();e.stopPropagation();
        if(!menu){open();if(e.key==='Home')highlight(0);if(e.key==='End')highlight(opts().length-1);return;}
        if(e.key==='Enter'||e.key===' '){choose(activeIndex);return;}
        if(e.key==='Home')highlight(0);else if(e.key==='End')highlight(opts().length-1);
        else highlight((activeIndex+(e.key==='ArrowDown'?1:-1)+opts().length)%opts().length);
      }else if(e.key==='Escape'&&menu){e.preventDefault();e.stopPropagation();close(true);}
      else if(e.key==='Tab'){close(false);}
      else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
        e.preventDefault();if(!menu)open();search+=e.key.toLocaleLowerCase();clearTimeout(searchTimer);searchTimer=setTimeout(()=>{search='';},650);
        const index=opts().findIndex(o=>o.textContent.trim().toLocaleLowerCase().startsWith(search));if(index>=0)highlight(index);
      }
    });
    trigger.addEventListener('blur',()=>{if(menu)close(false);});
    select.addEventListener('change',refresh);
    refresh();
  });
}

  const draw=()=>{
    const k=f.kind;
    let body=edit?'':`<div class="kind" data-group="kind">${[['out','Keluar'],['in','Masuk'],['save','Tabungan'],['transfer','Pindah']].map(([id,n])=>`<button aria-pressed="${k===id}" data-v="${id}">${n}</button>`).join('')}</div>`;
    body+=moneyField('f-amt','Jumlah',f.amount);
    if(k==='out')body+=categoryField(f.category,true)+descriptionField(f)+`<div class="field"><span class="lbl">Dari dompet</span>${walletDropdown('wallet',f.wallet)}</div>`;
    else if(k==='in')body+=`<div class="field"><label for="f-name">Keterangan / sumber pemasukan</label><input class="text" id="f-name" value="${esc(f.name)}" placeholder="Contoh: Gaji bulanan atau proyek video"></div><div class="field"><span class="lbl">Masuk ke dompet</span>${walletDropdown('wallet',f.wallet)}</div>`;
    else if(k==='save'){
      body+=`<div class="field"><span class="lbl">Arah</span>${chipRow('dir',[{id:'save',name:'Simpan ke tabungan'},{id:'withdraw',name:'Ambil dari tabungan'}],f.dir)}</div><div class="field"><span class="lbl">Tujuan</span>${S.goals.length?chipRow('goal',S.goals.map(g=>({id:g.id,name:g.name,sub:rp(goalSaved(g))})),f.goal):'<p class="hint">Tambahkan tujuan di halaman Tabungan terlebih dahulu.</p>'}</div><div class="field"><span class="lbl">${f.dir==='save'?'Dari dompet':'Masuk ke dompet'}</span>${walletDropdown('wallet',f.wallet)}</div><p class="hint">Perpindahan internal. Tidak dihitung sebagai pendapatan atau pengeluaran.</p>`;
    }else body+=`<div class="field"><span class="lbl">Dari dompet</span>${walletDropdown('wallet',f.wallet)}</div><div class="field"><span class="lbl">Ke dompet</span>${walletDropdown('toWallet',f.toWallet)}</div><p class="hint">Pindah dompet tidak mengubah total aset.</p>`;
    body+=dateField(f)+`<p class="err" id="f-err" hidden></p><button class="save" id="f-save">${edit?'Simpan perubahan':'Simpan'}</button>${edit?'<button class="del" id="f-del">Hapus catatan</button>':''}`;
    openSheet(edit?(k==='in'?'Ubah uang masuk':k==='out'?'Ubah uang keluar':'Ubah catatan'):'Catat uang',body,root=>{
      const keep=()=>{const n=root.querySelector('#f-name');if(n)f.name=n.value;};
      bindMoney(root.querySelector('#f-amt'),v=>{f.amount=v;});
      bindChips(root,'kind',v=>{keep();f.kind=v;draw();});
      bindWalletDropdown(root,'wallet',v=>{f.wallet=v;});bindWalletDropdown(root,'toWallet',v=>{f.toWallet=v;});bindChips(root,'goal',v=>{f.goal=v;});bindChips(root,'dir',v=>{keep();f.dir=v;draw();});bindDate(root,f);
      if(k==='out'){
        bindDescription(root,f);
        root.querySelector('#f-category').onchange=e=>{keep();f.category=e.target.value;f.manual=!!f.name;draw();};
        root.querySelector('#f-addcategory').onclick=()=>{keep();openCatForm(null,draw,id=>{f.category=id;f.manual=!!f.name;});};
      }
      root.querySelector('#f-save').onclick=()=>{
        keep();const err=msg=>{const el=root.querySelector('#f-err');el.textContent=msg;el.hidden=false;};
        if(!Number.isSafeInteger(f.amount)||f.amount<=0)return err('Isi jumlah yang lebih besar dari 0.');
        if(!validDate(f.date)||f.date>todayISO())return err('Pilih tanggal yang valid, tidak melebihi hari ini.');
        if(!activeWallet(f.wallet))return err('Pilih dompet aktif.');
        if(k==='out'&&!allCats().some(c=>c.id===f.category))return err('Pilih kategori.');
        if(['out','in'].includes(k)&&!f.name.trim())return err('Isi keterangan atau pilih dari dropdown.');
        if(k==='transfer'&&(!activeWallet(f.toWallet)||f.toWallet===f.wallet))return err('Pilih dompet tujuan yang berbeda.');
        if(k==='save'&&!S.goals.some(g=>g.id===f.goal))return err('Pilih tujuan tabungan.');
        const x=Object.assign({},edit||{});
        if(k==='out')Object.assign(x,{type:f.category==='harian'?'harian':'other',category:f.category,name:f.name.trim()});
        else if(k==='in')Object.assign(x,{type:'in',name:f.name.trim()});
        else if(k==='save'){const g=S.goals.find(g=>g.id===f.goal);Object.assign(x,{type:f.dir,goal:g.id,name:(f.dir==='save'?'Tabung: ':'Ambil: ')+g.name});}
        else Object.assign(x,{type:'transfer',toWallet:f.toWallet,name:'Pindah ke '+walletName(f.toWallet)});
        Object.assign(x,{id:edit?edit.id:uid('t'),amount:f.amount,wallet:f.wallet,date:f.date,month:monthOf(f.date),time:edit?edit.time:nowTime()});
        if(!edit)x.createdAt=new Date().toISOString();
        const before=edit?Object.assign({},edit):null;
        put('tx',x);finish();toast(edit?'Catatan diperbarui':'Catatan ditambahkan',()=>{before?put('tx',before):del('tx',x.id);if(back)back();});
      };
      if(edit)root.querySelector('#f-del').onclick=()=>{const before=Object.assign({},edit);del('tx',edit.id);finish();toast('Catatan dihapus',()=>{put('tx',before);if(back)back();});};
    },back);
  };
  draw();
}

function openAdjustView(x) {
  if(txArchivedWallets(x).length)return openArchivedTransaction(x,()=>openAdjustView(x));
  openSheet('Penyesuaian saldo', `<p class="hint" style="font-size:14.5px">${esc(walletName(x.wallet))} ${x.amount >= 0 ? 'ditambah' : 'dikurangi'} ${rp(Math.abs(x.amount))} pada ${dShort(x.date)}, supaya sama dengan saldo sebenarnya.</p><button class="del" id="f-del">Hapus penyesuaian</button>`, root => {
    root.querySelector('#f-del').onclick = () => { const s = Object.assign({}, x); del('tx', x.id); closeSheet(); render(); toast('Penyesuaian dihapus', () => put('tx', s)); };
  });
}

// ---- Bayar tagihan ----
function openPay(billId,m,edit,back) {
  if(edit&&txArchivedWallets(edit).length)return openArchivedTransaction(edit,()=>openPay(billId,m,edit,back),back);
  if(needWallet())return;
  const b=edit?S.bills.find(y=>y.id===edit.bill)||{id:edit.bill,name:edit.name,amount:edit.billTotal||edit.amount,category:edit.category}:S.bills.find(y=>y.id===billId);
  if(!b){toast('Tagihan tidak ditemukan',null,true);return;}
  const bm=edit?edit.billMonth:m;
  if(!ArtoModel.validMonth(bm)){toast('Periode tagihan tidak valid',null,true);return;}
  const st=billState(b,bm),originalPeriod=JSON.stringify((b.periodTotals||{})[bm]||null);
  if(!edit&&st.settled){toast('Tagihan periode ini sudah lunas. Ubah pembayaran melalui riwayat.');return;}
  const f={amount:edit?edit.amount:st.estimated?0:st.remaining,total:st.estimated?0:st.total,wallet:edit?edit.wallet:(activeWallets()[0]||{}).id,
    date:edit?edit.date:todayISO(),category:edit?categoryOf(edit).id:(b.category||'tagihan_lama'),name:edit?edit.name:b.name,manual:false};
  const finish=()=>{closeSheet();render();if(back)back();};
  const draw=()=>{
    const others=ArtoModel.billPayments(S,b,bm,todayISO()).filter(x=>!edit||x.id!==edit.id),otherPaid=sum(others);
    const totalInput=moneyField('f-total',b.variable?'Total tagihan sebenarnya':'Total tagihan periode ini',f.total);
    const totalEditor=b.variable?totalInput+`<p class="hint">Isi jumlah sebenarnya untuk ${mLabel(bm)}, bukan perkiraan. Berlaku hanya untuk periode ini.</p>`:
      `<details class="bill-period-edit"><summary>Ubah total tagihan periode ini</summary>${totalInput}<p class="hint">Perubahan ini tidak mengubah nominal rutin bulan berikutnya.</p></details>`;
    openSheet(edit?'Ubah pembayaran':'Bayar tagihan',`<div class="sum-box"><small>${esc(b.name)} - ${mLabel(bm)}</small><b class="num">${rp(f.total||st.total)}</b><small>${st.estimated?'Perkiraan; isi total sebenarnya di bawah.':'Total tagihan'}<br>Sudah dibayar ${rp(st.paid)}</small></div>
      ${totalEditor}${moneyField('f-amt',edit?'Jumlah pembayaran ini':'Bayar sekarang',f.amount)}<div class="payment-state" id="payment-state" aria-live="polite"></div>
      ${categoryField(f.category)}${descriptionField(f)}<div class="field"><span class="lbl">Dari dompet</span>${walletDropdown('wallet',f.wallet)}</div>${dateField(f)}
      <p class="err" id="f-err" hidden></p><p class="hint" style="margin-top:14px">Hanya jumlah yang dibayar mengurangi dompet. Sisa tetap muncul sampai lunas.</p>
      <button class="save" id="f-save">${edit?'Simpan perubahan':'Simpan pembayaran'}</button>${edit?'<button class="del" id="f-del">Hapus pembayaran ini</button>':''}`,root=>{
      const preview=()=>{const remaining=f.total-otherPaid-f.amount,el=root.querySelector('#payment-state');el.classList.toggle('over',remaining<0);
        el.innerHTML=!f.total?'<small>Isi total tagihan sebenarnya untuk menghitung sisa.</small>':remaining<0?`<small>Lebih bayar</small><b class="num">${rp(-remaining)}</b><small>Tidak otomatis mengurangi tagihan bulan berikutnya.</small>`:remaining===0&&otherPaid+f.amount>0?'<small>Status setelah disimpan</small><b>Lunas</b>':`<small>Sisa setelah pembayaran ini</small><b class="num">${rp(Math.max(0,remaining))}</b><small>${otherPaid+f.amount>0?'Dibayar sebagian':'Belum dibayar'}</small>`;};
      bindMoney(root.querySelector('#f-amt'),v=>{f.amount=v;preview();});
      bindMoney(root.querySelector('#f-total'),v=>{f.total=v;preview();});
      bindWalletDropdown(root,'wallet',v=>{f.wallet=v;});bindDate(root,f);bindDescription(root,f);preview();
      const keep=()=>{f.name=root.querySelector('#f-name').value;};
      root.querySelector('#f-category').onchange=e=>{keep();f.category=e.target.value;f.manual=!!f.name;draw();};
      root.querySelector('#f-save').onclick=()=>{
        keep();const err=msg=>{const el=root.querySelector('#f-err');el.hidden=false;el.textContent=msg;};
        if(!Number.isSafeInteger(f.total)||f.total<=0)return err('Isi total tagihan sebenarnya, lebih besar dari 0.');
        if(!Number.isSafeInteger(f.amount)||f.amount<=0)return err('Isi jumlah pembayaran, lebih besar dari 0.');
        if(!validDate(f.date)||f.date>todayISO())return err('Pilih tanggal yang valid.');
        if(!f.name.trim())return err('Isi keterangan.');
        if(!activeWallet(f.wallet))return err('Pilih dompet aktif.');
        const current=S.bills.find(y=>y.id===b.id);
        if(current&&JSON.stringify((current.periodTotals||{})[bm]||null)!==originalPeriod)return err('Total tagihan berubah di perangkat lain. Buka ulang formulir ini.');
        const stillPaid=sum(ArtoModel.billPayments(S,current||b,bm,todayISO()).filter(x=>!edit||x.id!==edit.id));
        // Recheck against current data so a second tab cannot blindly add another final payment.
        if(!edit&&stillPaid>=f.total)return err('Tagihan sudah lunas. Periksa riwayat pembayaran.');
        const stamp=new Date().toISOString();
        const x=Object.assign({},edit||{},{id:edit?edit.id:uid('t'),type:'bill',bill:b.id,billMonth:bm,billTotal:f.total,name:f.name.trim(),category:f.category,
          amount:f.amount,wallet:f.wallet,date:f.date,month:monthOf(f.date),time:edit?edit.time:nowTime(),updatedAt:stamp});
        if(!edit)x.createdAt=stamp;
        const changes=[{col:'tx',id:x.id,doc:x}];
        if(current){const doc=Object.assign({},current,{periodTotals:Object.assign({},current.periodTotals||{},{[bm]:{amount:f.total,confirmed:true,updatedAt:stamp}})});changes.push({col:'bills',id:doc.id,doc});}
        root.querySelector('#f-save').disabled=true;
        const undo=writeChanges(changes);finish();const remaining=Math.max(0,f.total-stillPaid-f.amount);
        toast(remaining?'Pembayaran disimpan. Sisa '+rp(remaining):'Tagihan lunas',()=>{undo();if(back)back();});
      };
      if(edit)root.querySelector('#f-del').onclick=()=>{
        const undo=writeChanges([{col:'tx',id:edit.id,doc:null}]);finish();toast('Pembayaran dihapus. Sisa tagihan dihitung ulang.',()=>{undo();if(back)back();});
      };
    },back);
  };
  draw();
}

// ---- Dompet ----
function openWalletList(back) {
  const list=activeWallets().slice().sort((a,b)=>walletBal(b)-walletBal(a)),closed=S.wallets.filter(w=>w.archived),total=sum(list,w=>walletBal(w));
  const row=w=>`<button class="set-row" data-w="${esc(w.id)}"><span class="ico g" style="width:36px;height:36px">${svg('wallet')}</span><span class="grow"><span class="t1">${esc(w.name)}</span>${w.archived?'<span class="t2">Dihapus dari daftar aktif - riwayat tersimpan</span>':''}</span><b class="num">${rp(walletBal(w))}</b><span class="chev">${svg('right',2.6)}</span></button>`;
  openSheet('Dompet',`<div class="sum-box"><small>Total saldo ${list.length} dompet aktif</small><b class="num">${rp(total)}</b></div><div class="set-group" style="margin-top:12px">${list.length?list.map(row).join(''):'<div class="empty">Belum ada dompet aktif.</div>'}</div>
    <div class="goal-btns" style="margin-top:14px"><button class="gbtn" id="wl-tr">Pindah uang</button><button class="gbtn main" id="wl-add">Tambah dompet</button></div>
    ${closed.length?`<details class="archived-wallets"><summary>Dompet dihapus (${closed.length})</summary><div class="set-group">${closed.map(row).join('')}</div><p class="hint">Tidak muncul di pilihan pembayaran baru. Riwayat dan saldo sebelum dihapus tetap tersedia.</p></details>`:''}`,root=>{
    const again=()=>openWalletList(back);
    root.querySelectorAll('[data-w]').forEach(r=>r.onclick=()=>openWalletForm(r.dataset.w,again));
    root.querySelector('#wl-add').onclick=()=>openWalletForm(null,again);
    root.querySelector('#wl-tr').onclick=()=>{if(list.length<2){toast('Butuh minimal dua dompet aktif untuk pindah uang');return;}openTx({kind:'transfer',back:again});};
  },back);
}
function restoreWallet(w,back) {
  const current=S.wallets.find(q=>q.id===w.id);if(!current)return;
  const undo=writeChanges([{col:'wallets',id:w.id,doc:Object.assign({},current,{archived:false,restoredAt:new Date().toISOString()})}]);
  render();if(back)back();else openWalletList();toast('Dompet dipulihkan. Pemindahan atau penyesuaian sebelumnya tetap tercatat.',undo);
}
function openArchivedTransaction(x,retry,back) {
  const closed=txArchivedWallets(x);
  openSheet('Riwayat dompet dihapus',`<div class="sum-box"><small>${esc(x.name)} - ${dShort(x.date)}</small><b class="num">${rp(x.amount)}</b></div>
    <p class="hint" style="margin-top:14px">Catatan ini tetap tersimpan. Pulihkan dompet berikut sebelum mengubah atau menghapus transaksi agar saldo tidak berubah tanpa terlihat.</p>
    ${closed.map(w=>`<button class="bar-btn" data-restore="${esc(w.id)}">Pulihkan ${esc(w.name)}</button>`).join('')}
    <p class="hint">Pemulihan tidak membatalkan pemindahan atau penyesuaian saldo saat dompet dihapus.</p>`,root=>{
    root.querySelectorAll('[data-restore]').forEach(btn=>btn.onclick=()=>restoreWallet(S.wallets.find(w=>w.id===btn.dataset.restore),retry));
  },back);
}
function openWalletForm(id,back) {
  const w=id?S.wallets.find(x=>x.id===id):null;
  if(w&&w.archived){
    openSheet(w.name,`<div class="sum-box"><small>Dompet dihapus dari daftar aktif</small><b class="num">${rp(walletBal(w))}</b></div><p class="hint" style="margin-top:14px">Riwayat transaksi dan saldo periode sebelumnya tetap tersimpan. Pulihkan untuk memakai atau mengubah catatan dompet ini.</p><button class="save" id="wallet-restore">Pulihkan dompet</button>`,root=>{
      root.querySelector('#wallet-restore').onclick=()=>restoreWallet(w,back||(()=>openWalletForm(w.id)));
    },back);return;
  }
  const f={name:w?w.name:'',initial:0},bal=w?walletBal(w):0;
  openSheet(w?w.name:'Tambah dompet',`<div class="field"><label for="f-name">Nama dompet</label><input id="f-name" class="text" value="${esc(f.name)}" placeholder="Contoh: BCA, Tunai, GoPay" autocomplete="off"></div>
    ${w?`<div class="sum-box" style="margin-top:16px"><small>Saldo sekarang</small><b class="num">${rp(bal)}</b></div><div class="goal-btns"><button class="gbtn" id="f-adj">Sesuaikan saldo</button><button class="gbtn" id="f-tr">Pindah uang</button></div>`:moneyField('f-init','Saldo awal',0)+'<p class="hint">Boleh dikosongkan kalau mulai dari Rp 0.</p>'}
    <p class="err" id="f-err" hidden></p><button class="save" id="f-save">${w?'Simpan nama':'Tambah dompet'}</button>${w?'<button class="del" id="f-del">Hapus dompet</button>':''}`,root=>{
    if(!w)bindMoney(root.querySelector('#f-init'),v=>{f.initial=v;});
    root.querySelector('#f-save').onclick=()=>{
      const n=root.querySelector('#f-name').value.trim();if(!n){root.querySelector('#f-err').textContent='Beri nama dompetnya.';root.querySelector('#f-err').hidden=false;return;}
      const current=w?S.wallets.find(x=>x.id===w.id):null;

      const doc=w?Object.assign({},current||w,{name:n}):{id:uid('w'),name:n,initial:f.initial,initialDate:todayISO(),order:S.wallets.length,createdAt:new Date().toISOString()};
      put('wallets',doc);render();toast(w?'Nama dompet disimpan':'Dompet '+n+' ditambahkan');if(back)back();else closeSheet();
    };
    if(w){
      root.querySelector('#f-adj').onclick=()=>openAdjust(w.id,()=>openWalletForm(w.id,back));
      root.querySelector('#f-tr').onclick=()=>{if(activeWallets().length<2){toast('Tambahkan dompet tujuan terlebih dahulu');return;}openTx({kind:'transfer',wallet:w.id,toWallet:activeWallets().find(x=>x.id!==w.id).id,back:()=>openWalletForm(w.id,back)});};
      root.querySelector('#f-del').onclick=()=>openWalletDelete(w.id,back);

}
function openWalletDelete(id,back) {
  const w=S.wallets.find(x=>x.id===id);if(!w||w.archived)return;
  const bal=walletBal(w),targets=activeWallets().filter(q=>q.id!==id),date=todayISO();

  const incomeCount=S.incomes.filter(t=>t.wallet===id).length;
  openSheet('Hapus dompet',`<div class="sum-box"><small>${esc(w.name)} - saldo saat ini</small><b class="num">${rp(bal)}</b></div>
    <p class="hint" style="margin-top:14px">Dompet hilang dari Beranda dan pilihan pembayaran baru. Riwayat tidak dihapus.</p>
    ${bal?`<div class="field"><label for="f-close-mode">Penanganan saldo</label><select class="sel" id="f-close-mode" data-artoselect data-icon="wallet">${targets.length?`<option value="transfer" selected>${bal>0?'Pindahkan ke dompet lain':'Tutup saldo minus'}</option>`:''}<option value="remove" ${targets.length?'':'selected'}>Keluarkan saldo dari pencatatan</option></select></div>
    <div class="field" id="close-target-field" ${targets.length?'':'hidden'}><label for="f-close-target">${bal>0?'Dompet tujuan':'Dompet sumber'}</label><select class="sel" id="f-close-target" data-artoselect data-icon="wallet">${targets.map(q=>`<option value="${esc(q.id)}" data-sub="${esc(rp(walletBal(q)))}">${esc(q.name)}</option>`).join('')}</select></div>`:''}
    <div class="note warn" id="close-impact" style="font-size:13px"></div>
    ${incomeCount?`<p class="hint">${incomeCount} pemasukan rutin memakai dompet ini. Pilih dompet aktif saat mengonfirmasi pemasukan berikutnya atau ubah tujuan di Pengaturan.</p>`:''}
    <label class="confirm-line"><input type="checkbox" id="close-confirm"><span>Saya memahami perubahan saldo di atas dan ingin menghapus dompet ini dari daftar aktif.</span></label>
    <p class="err" id="f-err" hidden></p><button class="save danger" id="wallet-close" disabled>Hapus dompet</button>`,root=>{
    const impact=()=>{root.querySelector('#close-impact').textContent=!bal?'Saldo nol. Total aset tidak berubah.':handling==='transfer'?
      (bal>0?'Saldo '+rp(bal)+' dipindahkan ke dompet tujuan. Total aset tidak berubah.':'Saldo minus '+rp(Math.abs(bal))+' ditutup dari dompet sumber. Total aset tidak berubah.'):
      (bal>0?'Total aset tercatat berkurang '+rp(bal)+'.':'Total aset tercatat bertambah '+rp(-bal)+'. Saldo minus tidak lagi dilacak.')+' Dicatat sebagai penyesuaian, bukan pemasukan atau pengeluaran. Uang di bank tidak dipindahkan.';
      const tf=root.querySelector('#close-target-field');if(tf)tf.hidden=handling!=='transfer';};
    const mode=root.querySelector('#f-close-mode');if(mode)mode.onchange=e=>{handling=e.target.value;root.querySelector('#close-confirm').checked=false;root.querySelector('#wallet-close').disabled=true;impact();};
    const ts=root.querySelector('#f-close-target');if(ts)ts.onchange=e=>{target=e.target.value;};
    root.querySelector('#close-confirm').onchange=e=>{root.querySelector('#wallet-close').disabled=!e.target.checked;};impact();
    root.querySelector('#wallet-close').onclick=()=>{
      const err=msg=>{root.querySelector('#f-err').textContent=msg;root.querySelector('#f-err').hidden=false;};
      if(!root.querySelector('#close-confirm').checked)return err('Konfirmasi perubahan saldo terlebih dahulu.');
      const current=S.wallets.find(q=>q.id===id);if(!current||current.archived)return err('Dompet sudah dihapus. Buka ulang daftar dompet.');
      if(walletBal(current)!==bal||todayISO()!==date)return err('Saldo atau tanggal berubah. Buka ulang penghapusan dompet.');
      if(S.tx.some(x=>(x.wallet===id||x.toWallet===id)&&x.date>date))return err('Ada transaksi bertanggal mendatang. Perbaiki tanggalnya sebelum menghapus dompet.');
      if(cloud.mode!=='local'&&(!cloud.user||!cloud.ready||cloud.pending||navigator.onLine===false))return err('Tunggu sinkronisasi selesai dan pastikan online sebelum menghapus dompet.');
      if(bal&&handling==='transfer'){
        if(!activeWallet(target)||target===id)return err('Pilih dompet lain yang masih aktif.');
        if(bal<0&&walletBal(S.wallets.find(q=>q.id===target))<Math.abs(bal))return err('Saldo dompet sumber tidak cukup untuk menutup saldo minus.');
      }
      const stamp=new Date().toISOString(),changes=[],doc=Object.assign({},current,{archived:true,archivedAt:stamp,archivedDate:date});
      if(bal){
        const tx={id:uid('t'),date,month:monthOf(date),time:nowTime(),createdAt:stamp,walletClosure:id};
        if(handling==='transfer')Object.assign(tx,{type:'transfer',amount:Math.abs(bal),wallet:bal>0?id:target,toWallet:bal>0?target:id,name:'Pemindahan saldo saat menghapus '+w.name});
        else Object.assign(tx,{type:'adjust',amount:-bal,wallet:id,name:'Penyesuaian saat menghapus '+w.name});
        changes.push({col:'tx',id:tx.id,doc:tx});doc.closureTxId=tx.id;
      }
      changes.push({col:'wallets',id,doc});root.querySelector('#wallet-close').disabled=true;
      const undo=writeChanges(changes);closeSheet();render();if(back)back();toast('Dompet dihapus. Riwayat tetap tersimpan.',undo);
    };
  },()=>openWalletForm(id,back));
}

function openBillManager(back) {

  const cm = curMonth(), monthly = list.filter(b => Number(b.freq) === 1), other = list.filter(b => Number(b.freq) !== 1);
  const perMonth = sum(monthly), thisMonth = sum(list.filter(b => billDue(b, cm)));

  const summary = list.length ? `<div class="sum-row"><div class="sum-box"><small>Total per bulan</small><b class="num">${rp(perMonth)}</b><small>${monthly.length} tagihan bulanan</small></div>

    <button class="save" id="f-add">Tambah tagihan</button>`, root => {
    root.querySelector('#f-add').onclick = () => openBillForm(null, () => openBillManager(back));
    root.querySelectorAll('[data-bill]').forEach(r => r.onclick = () => openBillForm(r.dataset.bill, () => openBillManager(back)));
  }, back);
}
function openBillForm(id, back) {
  const b = id ? S.bills.find(x => x.id === id) : null, cm = curMonth();
  const f = b ? Object.assign({}, b) : { name: '', amount: 0, variable: false, dueDay: 1, freq: 1, startMonth: cm, category:'rumah' }; f.category = f.category || (b ? 'tagihan_lama' : 'rumah');
  const firstMonthEditable = !b || (b.createdMonth || cm) === cm;
  f.thisMonth = b ? (b.startMonth || cm) <= cm : null;   // null = ikuti tanggal jatuh tempo
  const months = Array.from({ length: 12 }, (_, i) => shiftM(cm, i));
  if (f.startMonth && !months.includes(f.startMonth)) months.unshift(f.startMonth);
  const draw = () => openSheet(b ? 'Ubah tagihan' : 'Tambah tagihan', `<div class="field"><label for="f-name">Nama tagihan</label><input id="f-name" class="text" value="${esc(f.name)}" placeholder="Contoh: Internet rumah, STNK motor" autocomplete="off"></div>
    ${categoryField(f.category)}${moneyField('f-amt', f.variable ? 'Perkiraan jumlah' : 'Jumlah', f.amount)}
    <div class="field"><button class="toggle" id="f-var" role="switch" aria-checked="${!!f.variable}"><span class="grow"><span class="t1">Jumlahnya berubah-ubah</span><span class="t2">Isi jumlah sebenarnya saat membayar</span></span><span class="sw"><i></i></span></button></div>
    <div class="field"><label for="f-due">Jatuh tempo tanggal</label><select id="f-due" class="sel">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${Number(f.dueDay) === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Berulang</span>${chipRow('freq', FREQ, f.freq)}</div>
    ${Number(f.freq) === 1 && firstMonthEditable ? `<div class="field"><button class="toggle" id="f-this" role="switch" aria-checked="${f.thisMonth === null ? f.dueDay >= dayOf(todayISO()) : f.thisMonth}"><span class="grow"><span class="t1">Tagih mulai bulan ini</span><span class="t2">Matikan kalau tagihan ${mLabel(cm)} sudah dibayar sebelum memakai Arto</span></span><span class="sw"><i></i></span></button></div>` : ''}
    <div class="field" ${Number(f.freq) === 1 ? 'hidden' : ''} id="f-startf"><label for="f-start">Jatuh tempo berikutnya</label><select id="f-start" class="sel">${months.map(mm => `<option value="${mm}" ${mm === f.startMonth ? 'selected' : ''}>${mLabel(mm)}</option>`).join('')}</select></div>
    <p class="err" id="f-err" hidden></p><button class="save" id="f-save">${b ? 'Simpan perubahan' : 'Tambah tagihan'}</button>${b ? '<button class="del" id="f-del">Hapus tagihan</button>' : ''}`, root => {
    const keep = () => { f.name = root.querySelector('#f-name').value; f.dueDay = Number(root.querySelector('#f-due').value); f.startMonth = root.querySelector('#f-start').value; f.category = root.querySelector('#f-category').value; };
    bindMoney(root.querySelector('#f-amt'), v => { f.amount = v; });
    root.querySelector('#f-var').onclick = () => { keep(); f.variable = !f.variable; draw(); };
    const ft = root.querySelector('#f-this'); if (ft) ft.onclick = () => { keep(); f.thisMonth = ft.getAttribute('aria-checked') !== 'true'; draw(); };
    root.querySelector('#f-due').addEventListener('change', () => { if (f.thisMonth === null) { keep(); draw(); } });
    bindChips(root, 'freq', v => { keep(); f.freq = Number(v); if (f.freq === 1) f.startMonth = cm; draw(); });
    root.querySelector('#f-save').onclick = () => {
      keep();
      const err = m => { const e = root.querySelector('#f-err'); e.textContent = m; e.hidden = false; };
      if (!f.name.trim()) return err('Beri nama tagihannya.');
      if (!f.amount && !f.variable) return err('Isi jumlah tagihannya.');
      let start = f.startMonth;
      if (Number(f.freq) === 1) {
        if (firstMonthEditable) { const thisM = f.thisMonth === null ? f.dueDay >= dayOf(todayISO()) : f.thisMonth; start = thisM ? cm : shiftM(cm, 1); }
        else start = (b && b.startMonth) || cm;
      }
      const doc = Object.assign({}, b || {}, { id: b ? b.id : uid('b'), name: f.name.trim(), category:f.category, amount: f.amount, variable: !!f.variable, dueDay: f.dueDay, freq: Number(f.freq), startMonth: start, createdMonth: b ? b.createdMonth || cm : cm, active: true });
      put('bills', doc); render(); toast(b ? 'Tagihan diperbarui' : 'Tagihan ' + doc.name + ' ditambahkan'); back ? back() : closeSheet();
    };
    if (b) root.querySelector('#f-del').onclick = () => { const s = Object.assign({}, b); del('bills', b.id); render(); toast('Tagihan dihapus', () => put('bills', s)); back ? back() : closeSheet(); };
  }, back);
  draw();
}

      const list = storedCats().slice();

  const t = e.target.closest('[data-homeflow],[data-activity],[data-viewall],[data-arange],[data-afilter],[data-areturn],[data-go],[data-act],[data-pay],[data-edit],[data-quick],[data-savegoal],[data-withdraw],[data-goaledit],[data-wallet],[data-incok],[data-incedit],[data-f],[data-rm]');
  if (!t) return;
  const d = t.dataset;
  if (d.homeflow) selectHomeFlow(d.homeflow, true);
  else if (d.activity) openActivity(d.activity);
  else if (d.viewall) showActivityPage(d.viewall, document.querySelector('.page.on').id);
  else if (d.arange) { activityRange = d.arange; renderActivityPage(); }
  else if (d.afilter) { activityFilter = d.afilter; renderActivityPage(); }
  else if (d.areturn) go(activityFrom);
  else if (d.go) go(d.go);
  else if (d.pay) openPay(d.pay, d.m);
  else if (d.edit) openTx({ id: d.edit });
  else if (d.quick) openTx({kind:'out',category:'harian',name:d.quick});
  else if (d.savegoal) openTx({ kind: 'save', dir: 'save', goal: d.savegoal });
  else if (d.withdraw) openTx({ kind: 'save', dir: 'withdraw', goal: d.withdraw });
  else if (d.goaledit) openGoalForm(d.goaledit);
  else if (d.wallet) openWalletForm(d.wallet);
  else if (d.incok) confirmIncome(d.incok);
  else if (d.incedit) openIncomeConfirm(d.incedit);
  else if (d.f) { filter = d.f; renderRiwayat(); }
  else if (d.rm) { rMonth = d.rm === 'now' ? curMonth() : shiftM(rMonth, Number(d.rm)); renderRiwayat(); }
  else if (d.act === 'wallet-new') openWalletForm(null);
  else if (d.act === 'wallets') openWalletList();
  else if (d.act === 'transfer') { if (activeWallets().length < 2) { toast('Butuh minimal dua dompet untuk pindah uang'); return; } openTx({ kind: 'transfer' }); }
  else if (d.act === 'bills') openBillManager();
  else if (d.act === 'goal-new') openGoalForm(null);
  else if (d.act === 'cat-new') openCatForm(null);
  else if (d.act === 'categories') openCategoryManager();
  else if (d.act === 'limit') openNumberSetting('limit', 'Batas Harian', 'Batas jajan dan pengeluaran harian dalam sebulan, termasuk bensin dan belanja dapur.');
  else if (d.act === 'plan') openNumberSetting('planSave', 'Rencana tabungan', 'Sisa rencana yang belum ditabung bulan ini disisihkan dari "Bisa dipakai".');
  else if (d.act === 'share') shareReport();
  else if (d.act === 'mail') mailReport(t);
});
async function mailReport(btn) {
  if (!MAIL_URL || !auth || !auth.currentUser) { toast('Masuk ke akun untuk mengirim laporan.',null,true); return; }
  if (navigator.onLine === false) { toast('Hubungkan internet dan tunggu sinkronisasi sebelum mengirim laporan.',null,true); return; }
  const m = rMonth || curMonth(), old = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Mengirim...';
  let waitTimer;
  try {
    if (db && db.waitForPendingWrites) await Promise.race([
      db.waitForPendingWrites(),
      new Promise((_,reject)=>{ waitTimer=setTimeout(()=>reject(new Error('sync-pending')),12000); })
    ]);
    clearTimeout(waitTimer);
    const idToken = await auth.currentUser.getIdToken();
    const r = await fetch(MAIL_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken,month:m})});
    const out = await r.json();
    if (!r.ok || !out || !out.ok) throw new Error((out && out.error)||'send-failed');
    toast('Laporan '+mLabel(m)+' terkirim ke email');
  } catch(e) {
    console.error(e);
    toast(e.message==='sync-pending' ? 'Data belum selesai tersinkron. Coba lagi setelah koneksi stabil.' : 'Email gagal terkirim. Periksa koneksi dan deployment email.',null,true);
  } finally { clearTimeout(waitTimer); btn.disabled=false; btn.innerHTML=old; }
}
async function shareReport() {
  const text = reportText(rMonth || curMonth());
  if (navigator.share) { try { await navigator.share({ title: 'Laporan Arto', text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Laporan disalin'); } catch (e) { toast('Tidak bisa membagikan di perangkat ini', null, true); }
}

// ================= Aktivitas dan ringkasan laporan =================
const CATEGORY_COLORS=['#2447C6','#E5222B','#75B9E7','#1C389E','#5B6578','#2F7DB6','#A9B8ED','#24304A'];
let activityRange='30', activityFilter='all', activityQuery='', activityFrom='home';
function isExpense(x){return ['harian','other','bill'].includes(x.type);}
function validDate(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return false;
  const [y,m,d]=iso.split('-').map(Number), dt=new Date(y,m-1,d);
  return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d;
}
function categoryOf(x){ return ArtoModel.categoryOf(S,x,allCats()); }
function matchesFilter(x,f){
  if(f==='in')return x.type==='in';
  if(f==='out')return isExpense(x);
  if(f==='save')return ['save','withdraw'].includes(x.type);
  return true;
}
function recentActivity(kind,days){
  const end=todayISO(),start=isoAdd(end,-(days-1));
  return byDate(S.tx.filter(x=>x.date>=start&&x.date<=end&&matchesFilter(x,kind)));
}
function walletAt(w,end){ return ArtoModel.walletAt(S,w,end); }
function goalAt(g,end){ return ArtoModel.goalAt(S,g,end); }
function periodStats(start,end){ return ArtoModel.periodStats(S,start,end); }
function snapshot(m){ return ArtoModel.snapshot(S,m,todayISO()); }
function expenseGroups(T){ return ArtoModel.expenseGroups(S,T); }
function openActivity(kind,scroll=0){
  const arr=recentActivity(kind,10),label=kind==='in'?'uang masuk':'uang keluar',start=isoAdd(todayISO(),-9);
  openSheet('Riwayat '+label,`<div class="sum-box"><small>Total ${label} - 10 hari terakhir</small><b class="num" data-flow-total="${kind}">${rp(sum(arr))}</b><span class="period-label">${dShort(start)} ${start.slice(0,4)} - ${dShort(todayISO())} ${todayISO().slice(0,4)}<br>${arr.length} transaksi</span></div><p class="hint" style="margin-top:12px">Ketuk transaksi untuk mengubah jumlah, keterangan, dompet, atau tanggal.</p>${arr.length?groupByDay(arr):'<div class="empty">Belum ada aktivitas untuk periode ini.</div>'}<p class="info-caption">Transfer antar dompet dan tabungan ditampilkan terpisah, bukan pendapatan atau belanja.</p><div class="sheet-action"><button class="save" id="activity-viewall">View All - 30 hari</button></div>`,root=>{
    root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();const y=$('sheet').scrollTop;openTx({id:b.dataset.edit,back:()=>openActivity(kind,y)});});
    root.querySelector('#activity-viewall').onclick=()=>showActivityPage(kind,'home');
  });
  $('sheet').scrollTop=scroll;
}
function showActivityPage(kind='all',from='home'){
  activityFilter=kind;activityRange='30';activityQuery='';activityFrom=from==='riwayat'?'riwayat':'home';closeSheet();renderActivityPage();go('aktivitas');
}
function activityData(){
  const end=todayISO(),start=activityRange==='all'?'0000-01-01':isoAdd(end,-(Number(activityRange)-1));
  const all=S.tx.filter(x=>x.date>=start&&x.date<=end);
  const q=activityQuery.trim().toLowerCase();
  const shown=all.filter(x=>matchesFilter(x,activityFilter)&&(!q||[x.name,categoryOf(x).name,walletName(x.wallet)].some(v=>v.toLowerCase().includes(q))));
  return {all,shown,start,end};
}
function renderActivityPage(){
  const el=$('aktivitas');if(!el)return;
  el.innerHTML=`<button class="inline-back" data-areturn="true">${svg('left')}Kembali ke ${activityFrom==='home'?'Beranda':'Riwayat'}</button><div class="activity-heading"><h1 class="title">Aktivitas</h1><select id="activity-range" class="range-select" aria-label="Periode aktivitas">${[['10','10 hari terakhir'],['30','30 hari terakhir'],['90','90 hari terakhir'],['all','Semua tanggal']].map(([v,l])=>`<option value="${v}" ${activityRange===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="seg activity-filters" role="group" aria-label="Jenis aktivitas">${[['all','Semua'],['in','Masuk'],['out','Keluar'],['save','Tabungan']].map(([v,l])=>`<button data-afilter="${v}" aria-pressed="${activityFilter===v}">${l}</button>`).join('')}</div><input type="search" id="activity-search" class="text search-field" placeholder="Cari keterangan, kategori, dompet..." value="${esc(activityQuery)}" aria-label="Cari transaksi"><div id="activity-results"></div>`;
  $('activity-range').onchange=e=>{activityRange=e.target.value;renderActivityResults();};
  $('activity-search').oninput=e=>{activityQuery=e.target.value;renderActivityResults();};
  renderActivityResults();
}
function renderActivityResults(){
  const {shown,start,end}=activityData(),incoming=sum(shown.filter(x=>x.type==='in')),outgoing=sum(shown.filter(isExpense));
  const scope=activityRange==='all'?'Seluruh tanggal':dShort(start)+' '+start.slice(0,4)+' - '+dShort(end)+' '+end.slice(0,4);
  let summary;
  if(activityFilter==='in'||activityFilter==='out')summary=`<div class="sum-box" style="margin-top:14px"><small>Total uang ${activityFilter==='in'?'masuk':'keluar'}${activityQuery?' sesuai pencarian':''}</small><b class="num">${rp(sum(shown))}</b></div>`;
  else if(activityFilter==='save')summary=`<div class="flow-totals"><div class="sum-box"><small>Ditabung</small><b class="num">${rp(sum(shown.filter(x=>x.type==='save')))}</b></div><div class="sum-box"><small>Diambil</small><b class="num">${rp(sum(shown.filter(x=>x.type==='withdraw')))}</b></div></div>`;
  else summary=`<div class="flow-totals"><div class="sum-box"><small>Uang masuk</small><b class="num">${rp(incoming)}</b></div><div class="sum-box"><small>Uang keluar</small><b class="num">${rp(outgoing)}</b></div></div>`;
  $('activity-results').innerHTML=summary+`<div class="period-label" style="margin:10px 2px">${scope}<br>${shown.length} transaksi${activityQuery?' sesuai pencarian':''}. Ketuk untuk mengedit.</div>${shown.length?groupByDay(shown):'<div class="list"><div class="empty">Tidak ada transaksi untuk pilihan ini.</div></div>'}`;
}
function openCategoryManager(back){
  openSheet('Kelola kategori',`<p class="hint" style="margin-top:0">Kategori menjelaskan jenis pengeluaran. Sumber pembayaran tetap dompet.</p><div class="set-label">Kategori bawaan</div><div class="set-group">${CATS.map(c=>`<div class="set-row category-row"><span class="ico g" style="width:36px;height:36px">${svg(c.icon)}</span><span class="grow t1">${esc(c.name)}</span><small>Bawaan</small></div>`).join('')}</div><div class="set-label">Kategori tambahan</div><div class="set-group">${customCats().length?customCats().map(c=>`<button class="set-row" data-custom-category="${esc(c.id)}"><span class="ico g" style="width:36px;height:36px">${svg(c.icon)}</span><span class="grow t1">${esc(c.name)}</span><span class="chev">${svg('right')}</span></button>`).join(''):'<div class="empty">Belum ada kategori tambahan.</div>'}</div><button class="save" id="category-add">Tambah kategori</button>`,root=>{
    const again=()=>openCategoryManager(back);root.querySelector('#category-add').onclick=()=>openCatForm(null,again);root.querySelectorAll('[data-custom-category]').forEach(b=>b.onclick=()=>openCatForm(b.dataset.customCategory,again));
  },back);
}

async function checkUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  try { const r = await fetch('./index.html', { cache: 'no-store' }); if (!r.ok) return; const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) { const t = $('toast'); t.className = 'toast'; t.innerHTML = '<span>Versi baru Arto tersedia</span><button id="t-reload">Muat ulang</button>'; t.hidden = false; placeToast(); $('t-reload').onclick = () => location.reload(); } } catch (e) {}
}
setTimeout(checkUpdate, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
window.__arto = { S: () => S, render, go, totalBal, goalSaved, savingsUpTo, snapshot, categoryOf, recentActivity, periodStats, openTx, openActivity, showActivityPage, reportText, todayISO, isoAdd, model: ArtoModel, billState, openBills, overview, openPay, openWalletList, openWalletForm, openWalletDelete, activeWallets, writeChanges };
