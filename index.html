<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#F3F5FA">
<title>Arto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #F3F5FA; --card: #FFFFFF; --bg-2: #E9EDF5; --line: #E4E8F0;
    --blue: #2447C6; --blue-2: #1C389E; --blue-soft: #E3E9FA;
    --red: #E5222B; --red-soft: #FDE1E2; --red-ink: #BD1720;
    --sky: #75B9E7; --sky-soft: #E3F1FB; --sky-ink: #23679A;
    --ink: #24304A; --muted: #5B6578;
    --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: only light;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  [hidden] { display: none !important; }
  .app { max-width: 440px; margin: 0 auto; padding: 16px 18px 118px; }

  .top { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--blue); overflow: hidden; flex-shrink: 0; }
  .hello { flex: 1; min-width: 0; }
  .hello b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .hello span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex-shrink: 0; color: var(--muted); }
  .icon-btn svg { width: 20px; height: 20px; }
  .sync { display: inline-flex; align-items: center; gap: 5px; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .page { display: none; }
  .page.on { display: block; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .title { margin: 20px 2px 0; font-size: 26px; font-weight: 800; font-style: italic; letter-spacing: -0.03em; color: var(--blue); }
  .sec { margin: 26px 2px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec h2 { margin: 0; font-size: 16.5px; font-weight: 800; }
  .sec span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .link { font-size: 13.5px; font-weight: 700; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }

  .hero { margin-top: 16px; background: var(--blue); color: #fff; border-radius: 28px; padding: 22px; }
  .hero .cap { font-size: 14px; font-weight: 700; font-style: italic; color: #D7DEFB; }
  .hero .big { font-size: clamp(30px, 10vw, 40px); font-weight: 800; line-height: 1.08; margin-top: 2px; white-space: nowrap; }
  .hero .sub { margin-top: 6px; font-size: 13.5px; color: #E3E8FC; font-weight: 500; }
  .flow3 { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .total-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.18); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13.5px; color: #E3E8FC; font-weight: 600; }
  .total-row b { font-size: 17px; font-weight: 800; color: #fff; white-space: nowrap; }
  .fb { background: rgba(255,255,255,.1); border-radius: 16px; padding: 10px 12px; }
  .fb small { display: block; font-size: 12.5px; color: #D7DEFB; font-weight: 600; }
  .fb b { font-size: 15px; font-weight: 800; white-space: nowrap; }

  .wallets { display: flex; gap: 10px; overflow-x: auto; margin: 0 -18px; padding: 2px 18px 4px; scrollbar-width: none; }
  .wallets::-webkit-scrollbar { display: none; }
  .wcard { flex: 0 0 auto; min-width: 140px; background: var(--card); border-radius: 20px; padding: 14px 16px; text-align: left; }
  .wcard small { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .wcard small svg { width: 15px; height: 15px; }
  .wcard b { display: block; margin-top: 6px; font-size: 17px; font-weight: 800; white-space: nowrap; }
  .wcard.add { min-width: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--blue); font-weight: 800; font-size: 13.5px; border: 1.5px dashed #B9C5EC; background: transparent; }
  .wcard.add svg { width: 20px; height: 20px; }

  .pk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pk { background: var(--card); border-radius: 24px; padding: 16px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 156px; }
  .pk.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 0; }
  .pk-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .pk-name { font-size: 14px; font-weight: 800; font-style: italic; display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .pk-val { font-size: clamp(17px, 5.2vw, 21px); font-weight: 800; line-height: 1.1; white-space: nowrap; }
  .pk-sub { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 3px; }
  .ring { position: relative; flex-shrink: 0; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; }

  .list { background: var(--card); border-radius: 24px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 66px; width: 100%; text-align: left; }
  .row + .row { border-top: 1px solid var(--line); }
  button.row:active { background: var(--bg-2); }
  .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; }
  .ico svg { width: 20px; height: 20px; }
  .ico.b { background: var(--blue-soft); color: var(--blue); }
  .ico.r { background: var(--red-soft); color: var(--red-ink); }
  .ico.s { background: var(--sky-soft); color: var(--sky-ink); }
  .ico.g { background: var(--bg-2); color: var(--ink); }
  .ico.in { background: var(--blue); color: #fff; }
  .grow { flex: 1; min-width: 0; }
  .t1 { display: block; font-weight: 700; font-size: 15px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t2 { display: block; font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-weight: 800; font-size: 15px; text-align: right; white-space: nowrap; }
  .amt.pos { color: var(--blue-2); }
  .tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 8px; background: var(--bg-2); color: var(--muted); }
  .tag.soon { background: var(--ink); color: #fff; }
  .tag.late { background: var(--red-soft); color: var(--red-ink); }
  .pay { height: 38px; padding: 0 14px; border-radius: 19px; background: var(--blue); color: #fff; font-weight: 800; font-size: 13.5px; flex-shrink: 0; }
  .ghost { height: 38px; padding: 0 14px; border-radius: 19px; background: var(--bg-2); font-weight: 800; font-size: 13.5px; flex-shrink: 0; }
  .empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .start { background: var(--card); border-radius: 24px; padding: 20px; text-align: center; }
  .start b { display: block; font-size: 17px; font-weight: 800; }
  .start p { margin: 6px 0 16px; color: var(--muted); font-size: 14px; }

  .pending { margin-top: 12px; background: var(--card); border-radius: 22px; padding: 14px 16px; border: 1.5px solid #C9D4F6; }
  .pending .row { padding: 8px 0; min-height: 0; }
  .pending .row + .row { border-top: 1px solid var(--line); }
  .pending h3 { margin: 0 0 4px; font-size: 14px; font-weight: 800; color: var(--blue); font-style: italic; }

  .lead { margin-top: 14px; border-radius: 28px; padding: 20px; display: flex; align-items: center; gap: 16px; }
  .lead.blue { background: var(--blue); color: #fff; }
  .lead.red { background: var(--red-soft); }
  .lead.plain { background: var(--card); }
  .lead .cap { font-size: 13.5px; font-weight: 600; opacity: .88; }
  .lead .big { font-size: clamp(22px, 7vw, 30px); font-weight: 800; line-height: 1.08; margin-top: 2px; white-space: nowrap; }
  .lead .sub { font-size: 13.5px; font-weight: 600; margin-top: 6px; opacity: .92; }
  .lead.plain .cap, .lead.plain .sub { color: var(--muted); opacity: 1; }
  .stats { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border-radius: 18px; padding: 12px; }
  .stat small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .stat b { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .note { margin-top: 10px; border-radius: 18px; padding: 12px 14px; font-size: 14px; font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }
  .note svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
  .note.good { background: var(--blue-soft); color: var(--blue-2); }
  .note.warn { background: var(--red-soft); color: var(--red-ink); }
  .bar-btn { margin-top: 10px; width: 100%; height: 46px; border-radius: 16px; background: var(--card); font-weight: 800; font-size: 14px; color: var(--blue); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .bar-btn svg { width: 18px; height: 18px; }
  .rep-btns { margin-top: 10px; display: flex; gap: 8px; }
  .rep-btns .bar-btn { margin-top: 0; flex: 1; }
  .bar-btn.main { background: var(--blue); color: #fff; }

  .top-list { background: var(--card); border-radius: 24px; padding: 6px 16px; }
  .tl { padding: 11px 0; }
  .tl + .tl { border-top: 1px solid var(--line); }
  .tl-head { display: flex; align-items: center; gap: 10px; }
  .tl-head .ico { width: 34px; height: 34px; border-radius: 11px; }
  .tl-head .ico svg { width: 17px; height: 17px; }
  .tl-name { flex: 1; min-width: 0; font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-name small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .tl-amt { font-weight: 800; font-size: 14.5px; white-space: nowrap; text-align: right; }
  .tl-amt small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .tl-bar { margin: 8px 0 0 44px; height: 7px; border-radius: 4px; background: var(--bg-2); overflow: hidden; }
  .tl-bar i { display: block; height: 100%; border-radius: 4px; }
  .split { background: var(--card); border-radius: 24px; padding: 16px; }
  .split-bar { height: 14px; border-radius: 7px; overflow: hidden; display: flex; gap: 2px; }
  .split-leg { margin-top: 12px; display: grid; gap: 8px; }
  .split-leg div { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .split-leg i { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .split-leg span { flex: 1; font-weight: 600; }
  .split-leg b { font-weight: 800; white-space: nowrap; }
  .split-leg em { font-style: normal; color: var(--muted); font-weight: 700; font-size: 13px; width: 40px; text-align: right; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 42px; padding: 0 14px; border-radius: 21px; background: var(--card); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .chip svg { width: 17px; height: 17px; flex-shrink: 0; }
  .chip.two { height: auto; min-height: 50px; padding: 6px 16px 6px 14px; border-radius: 18px; }
  .chip-txt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; text-align: left; }
  .chip-txt small { font-size: 12px; font-weight: 600; opacity: .72; margin-top: 1px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .goal { background: var(--card); border-radius: 22px; padding: 16px; }
  .goal + .goal { margin-top: 10px; }
  .goal-top { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .gbar { margin-top: 12px; height: 8px; border-radius: 5px; background: var(--sky-soft); overflow: hidden; }
  .gbar i { display: block; height: 100%; background: var(--sky); border-radius: 5px; }
  .goal-foot { margin-top: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .goal-btns { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gbtn { height: 42px; border-radius: 14px; font-weight: 800; font-size: 14px; background: var(--card); border: 1.5px solid var(--line); }
  .gbtn.main { background: var(--ink); color: #fff; border-color: var(--ink); }

  .mnav { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
  .mbtn { width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex-shrink: 0; }
  .mbtn svg { width: 18px; height: 18px; }
  .mbtn:disabled { opacity: .3; }
  .mlabel { flex: 1; height: 46px; border-radius: 23px; background: var(--card); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .mlabel b { font-size: 15.5px; font-weight: 800; }
  .now { font-size: 12px; font-weight: 800; color: var(--blue); background: var(--blue-soft); border-radius: 10px; padding: 2px 8px; }
  .ledger { margin-top: 10px; background: var(--card); border-radius: 24px; padding: 6px 16px; }
  .lg { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; font-size: 14.5px; }
  .lg + .lg { border-top: 1px solid var(--line); }
  .lg span { color: var(--muted); font-weight: 600; }
  .lg b { font-weight: 800; white-space: nowrap; }
  .lg.total span, .lg.total b { color: var(--ink); font-size: 16px; font-weight: 800; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--card); padding: 4px; border-radius: 18px; margin-top: 18px; }
  .seg button { height: 40px; border-radius: 14px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .day { margin: 18px 4px 8px; display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700; color: var(--muted); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 10px); pointer-events: none; }
  .nav-in { pointer-events: auto; max-width: 440px; margin: 0 auto; background: var(--card); border-radius: 26px; padding: 6px; display: grid; grid-template-columns: 1fr 1fr 74px 1fr 1fr; align-items: center; box-shadow: 0 12px 30px -14px rgba(36,48,74,.35); border: 1px solid var(--line); }
  .nav .tab { height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .nav .tab svg { width: 22px; height: 22px; }
  .nav .tab[aria-current="page"] { color: var(--blue); background: var(--blue-soft); }
  .plus { justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; margin-top: -28px; box-shadow: 0 10px 20px -8px rgba(229,34,43,.6); border: 4px solid var(--card); }
  .plus svg { width: 26px; height: 26px; }

  .scrim { position: fixed; left: 0; right: 0; z-index: 40; background: rgba(36,48,74,.45); display: flex; align-items: flex-end; justify-content: center; padding: 10px; }
  .sheet { width: 100%; max-width: 440px; overflow-y: auto; background: var(--card); border-radius: 30px; padding: 10px 20px 20px; animation: up .24s cubic-bezier(.2,1.1,.4,1); }
  @keyframes up { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sh-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sh-head h3 { margin: 0; flex: 1; font-size: 19px; font-weight: 800; font-style: italic; color: var(--blue); }
  .back { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; }
  .back svg { width: 16px; height: 16px; }
  .kind { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg-2); padding: 4px; border-radius: 18px; }
  .kind button { height: 42px; border-radius: 14px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
  .kind button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(36,48,74,.15); }
  .field { margin-top: 16px; }
  .field > label, .field > .lbl { display: block; font-size: 13.5px; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
  .money { display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 18px; border-radius: 20px; background: var(--bg-2); }
  .money span { font-weight: 800; font-size: 20px; color: var(--muted); }
  .money input { flex: 1; min-width: 0; border: 0; background: transparent; font-weight: 800; font-size: 28px; outline: none; letter-spacing: -0.02em; }
  .text, .sel { width: 100%; height: 50px; padding: 0 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); outline: none; }
  .text:focus, .sel:focus { border-color: var(--blue); }
  .sheet .chip { background: var(--bg-2); }
  .sheet .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .hint { margin: 6px 2px 0; font-size: 13px; color: var(--muted); font-weight: 500; }
  .err { margin: 10px 2px 0; font-size: 13.5px; color: var(--red-ink); font-weight: 700; }
  .save { margin-top: 18px; width: 100%; height: 56px; border-radius: 20px; background: var(--blue); color: #fff; font-weight: 800; font-size: 16px; }
  .save:disabled { opacity: .45; }
  .del { margin-top: 8px; width: 100%; height: 48px; border-radius: 16px; color: var(--red-ink); font-weight: 800; font-size: 14.5px; }
  .toggle { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--bg-2); border-radius: 18px; padding: 12px 14px; }
  .sw { width: 48px; height: 28px; border-radius: 14px; padding: 3px; background: #C3CAD8; transition: background .15s; flex-shrink: 0; }
  .sw i { display: block; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle[aria-checked="true"] .sw { background: var(--blue); }
  .toggle[aria-checked="true"] .sw i { transform: translateX(20px); }
  .set-group { background: var(--bg-2); border-radius: 20px; overflow: hidden; }
  .set-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; min-height: 58px; }
  .set-row + .set-row { border-top: 1px solid #DCE1EB; }
  .set-row .chev { color: var(--muted); }
  .set-row .chev svg { width: 14px; height: 14px; }
  .sum-box { background: var(--bg-2); border-radius: 20px; padding: 14px 16px; }
  .sum-box small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  .sum-box b { display: block; font-size: 24px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
  .sum-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sum-row .sum-box b { font-size: 18px; }
  .set-label { margin: 18px 4px 8px; font-size: 13px; font-weight: 800; color: var(--muted); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); z-index: 60; background: var(--ink); color: #fff; padding: 8px 8px 8px 18px; min-height: 48px; border-radius: 24px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 24px -10px rgba(36,48,74,.6); width: max-content; max-width: calc(100% - 32px); }
  .toast.solo { padding-right: 18px; }
  .toast button { height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(255,255,255,.16); font-weight: 800; flex-shrink: 0; }
  .toast.err { background: var(--red-ink); }

  .screen { position: fixed; inset: 0; z-index: 70; background: var(--bg); overflow-y: auto; }
  .screen-in { max-width: 400px; margin: 0 auto; min-height: 100%; padding: 40px 24px 32px; display: flex; flex-direction: column; justify-content: center; }
  .brand { width: 64px; height: 64px; border-radius: 20px; background: var(--blue); color: #fff; display: grid; place-items: center; overflow: hidden; }
  .screen h1 { margin: 20px 0 0; font-size: 34px; font-weight: 800; font-style: italic; color: var(--blue); letter-spacing: -0.03em; }
  .screen p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .pin-dots { display: flex; gap: 16px; justify-content: center; margin: 26px 0; }
  .pin-dots i { width: 15px; height: 15px; border-radius: 50%; background: var(--bg-2); transition: background .12s; }
  .pin-dots i.on { background: var(--blue); }
  .pin-dots.shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: none; } 25%,75% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: 0 auto; width: 100%; }
  .keys button { height: 66px; border-radius: 22px; background: var(--card); font-size: 26px; font-weight: 700; }
  .keys button.plain { background: transparent; color: var(--muted); font-size: 20px; }
  .keys button:active { background: var(--bg-2); }
  .boot { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: grid; place-items: center; transition: opacity .28s ease; }
  .boot img { width: 112px; height: 112px; border-radius: 28px; display: block; }
  .boot.out { opacity: 0; pointer-events: none; }
  .loading { position: fixed; inset: 0; z-index: 65; background: rgba(243,245,250,.94); display: grid; place-items: center; text-align: center; }
  .loading .brand { margin: 0 auto; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.92); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

  { id: 'transport', name: 'Transport', icon: 'motor' }, { id: 'jajan', name: 'Jajan', icon: 'snack' },

// Kategori bawaan + kategori buatan sendiri (disimpan di config.cats); "Lainnya" selalu paling akhir

const catOf = id => allCats().find(c => c.id === id) || CATS[CATS.length - 1];
const ICON_CHOICES = ['food', 'coffee', 'motor', 'snack', 'basket', 'fun', 'hobby', 'sport', 'gift', 'heart', 'book', 'shirt', 'pill', 'phone', 'paw', 'star'];

const pocketColor = id => { const i = customPockets().findIndex(p => p.id === id); return i < 0 ? 'var(--sky)' : POCKET_COLORS[i % POCKET_COLORS.length]; };
const otherLabel = x => (x.pocket && pocketOf(x.pocket)) ? pocketOf(x.pocket).name : 'Tak terduga';
const otherIcon = x => (x.pocket && pocketOf(x.pocket)) ? pocketOf(x.pocket).icon : 'bolt';
const FREQ = [{ id: 1, name: 'Tiap bulan' }, { id: 3, name: 'Tiap 3 bulan' }, { id: 6, name: 'Tiap 6 bulan' }, { id: 12, name: 'Setahun sekali' }];

// ================= Data =================
// tx.type: in | harian | other | bill | save | withdraw | transfer | adjust
const EMPTY = () => ({ wallets: [], bills: [], goals: [], incomes: [], tx: [], config: { limit: 0, planSave: 0 } });
let S = EMPTY();
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && Array.isArray(c.tx)) S = Object.assign(EMPTY(), c); } catch (e) {}
const COLS = ['wallets', 'bills', 'goals', 'incomes', 'tx'];
function cache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(S)); } catch (e) {} }

const cloud = { available: false, user: null, ready: false, mode: (() => { try { return localStorage.getItem(MODE_KEY) || 'cloud'; } catch (e) { return 'cloud'; } })(), pending: false, online: navigator.onLine !== false };
let db = null, auth = null, unsubs = [];
const strip = d => { const o = Object.assign({}, d); delete o.id; return JSON.parse(JSON.stringify(o)); };
function remote(fn) {
  if (!(cloud.user && db)) return;
  try { const p = fn(); if (p && p.catch) p.catch(e => { console.error(e); toast('Gagal menyimpan. Periksa koneksi internet.', null, true); }); } catch (e) { console.error(e); }
}
function put(col, doc) {
  const arr = S[col], i = arr.findIndex(x => x.id === doc.id);
  if (i >= 0) arr[i] = doc; else arr.push(doc);
  cache(); remote(() => db.collection(col).doc(doc.id).set(strip(doc)));
}
function del(col, id) { S[col] = S[col].filter(x => x.id !== id); cache(); remote(() => db.collection(col).doc(id).delete()); }
function putConfig(patch) { Object.assign(S.config, patch); cache(); remote(() => db.collection('config').doc('main').set(patch, { merge: true })); }

// ================= Hitungan =================
function effect(x, wid) {
  const a = Number(x.amount) || 0;
  switch (x.type) {
    case 'in': case 'withdraw': return x.wallet === wid ? a : 0;
    case 'harian': case 'other': case 'bill': case 'save': return x.wallet === wid ? -a : 0;
    case 'transfer': return (x.wallet === wid ? -a : 0) + (x.toWallet === wid ? a : 0);
    case 'adjust': return x.wallet === wid ? a : 0;
  }
  return 0;
}
const walletBal = (w, upToMonth) => (Number(w.initial) || 0) + S.tx.filter(x => !upToMonth || x.month <= upToMonth).reduce((t, x) => t + effect(x, w.id), 0);
const totalBal = upToMonth => S.wallets.reduce((t, w) => t + walletBal(w, upToMonth), 0);
const txIn = m => S.tx.filter(x => x.month === m);
function monthStats(m) {
  const T = txIn(m), by = t => T.filter(x => x.type === t);
  const income = sum(by('in')), bills = sum(by('bill')), harian = sum(by('harian')), other = sum(by('other'));
  const saved = sum(by('save')) - sum(by('withdraw')), adjust = sum(by('adjust'));
  const opening = S.wallets.reduce((t, w) => t + (Number(w.initial) || 0), 0) + S.tx.filter(x => x.month < m).reduce((t, x) => t + S.wallets.reduce((u, w) => u + effect(x, w.id), 0), 0);
  return { income, bills, harian, other, saved, adjust, out: bills + harian + other, opening, closing: opening + income - bills - harian - other - saved + adjust };
}
const billDue = (b, m) => b.active !== false && m >= (b.startMonth || m) && (mIndex(m) - mIndex(b.startMonth || m)) % (Number(b.freq) || 1) === 0;
const billPaid = (b, m) => S.tx.find(x => x.type === 'bill' && x.bill === b.id && x.billMonth === m);
const dueDayIn = (b, m) => Math.min(Number(b.dueDay) || 1, daysIn(m));
function openBills() {
  const m = curMonth(), prev = shiftM(m, -1), out = [];
  S.bills.forEach(b => {
    if (billDue(b, prev) && !billPaid(b, prev) && (b.createdMonth || '0000') <= prev) out.push({ b, m: prev });
    if (billDue(b, m) && !billPaid(b, m)) out.push({ b, m });
  });
  return out.sort((a, c) => (a.m + pad2(dueDayIn(a.b, a.m))).localeCompare(c.m + pad2(dueDayIn(c.b, c.m))));
}
const savingsUpTo = m => sum(S.goals, g => Number(g.initial) || 0) + sum(S.tx.filter(x => x.type === 'save' && (!m || x.month <= m))) - sum(S.tx.filter(x => x.type === 'withdraw' && (!m || x.month <= m)));
const goalSaved = g => (Number(g.initial) || 0) + sum(S.tx.filter(x => x.type === 'save' && x.goal === g.id)) - sum(S.tx.filter(x => x.type === 'withdraw' && x.goal === g.id));
const goalMonth = (g, m) => sum(txIn(m).filter(x => x.type === 'save' && x.goal === g.id)) - sum(txIn(m).filter(x => x.type === 'withdraw' && x.goal === g.id));
function overview() {
  const m = curMonth(), st = monthStats(m), bal = totalBal();
  const ob = openBills(), unpaid = sum(ob, o => o.b.amount);
  const planLeft = Math.max(0, (Number(S.config.planSave) || 0) - st.saved);
  return { m, st, bal, ob, unpaid, planLeft, free: bal - unpaid - planLeft };
}
const pendingIncomes = () => { const m = curMonth(); return S.incomes.filter(t => !S.tx.some(x => x.type === 'in' && x.tpl === t.id && x.month === m)); };
const walletName = id => (S.wallets.find(w => w.id === id) || { name: 'Dompet terhapus' }).name;

function ring(pct, color, track, size, stroke, label) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><b>${label}</b></div>`;
}

// ================= Baris =================
const dueDate = (b, m) => m + '-' + pad2(dueDayIn(b, m));
const daysBetween = (a, b) => { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); };
const SOON_DAYS = 10;
// Tagihan bulan ini & bulan depan yang jatuh tempo dalam 10 hari ke depan (belum dibayar)
function upcomingBills(days) {
  const t = todayISO(), cm = curMonth(), out = [];
  [cm, shiftM(cm, 1)].forEach(m => S.bills.forEach(b => {
    if (!billDue(b, m) || billPaid(b, m)) return;
    const d = daysBetween(t, dueDate(b, m));
    if (d >= 0 && d <= days) out.push({ b, m, d });
  }));
  return out.sort((a, c) => a.d - c.d);
}
function dueTag(o) {
  const cm = curMonth();
  if (o.m < cm) return '<span class="tag late">Belum dibayar bulan lalu</span>';
  const d = daysBetween(todayISO(), dueDate(o.b, o.m));
  if (d < 0) return '<span class="tag late">Lewat jatuh tempo</span>';
  if (d <= 2) return `<span class="tag soon">${d === 0 ? 'Hari ini' : d === 1 ? 'Besok' : '2 hari lagi'}</span>`;
  if (d <= SOON_DAYS) return `<span class="tag">${d} hari lagi, ${dueDayIn(o.b, o.m)} ${mShort(o.m)}</span>`;
  return `<span class="tag">Tanggal ${dueDayIn(o.b, o.m)}${o.m !== cm ? ' ' + mShort(o.m) : ''}</span>`;
}
const billRow = o => `<div class="row"><span class="ico b">${svg('receipt')}</span>
  <span class="grow"><span class="t1">${esc(o.b.name)}</span><span class="t2">${o.b.variable ? 'Kira-kira ' : ''}${rp(o.b.amount)}</span>${dueTag(o)}</span>
  <button class="pay" data-pay="${o.b.id}" data-m="${o.m}">Bayar</button></div>`;
const TT = { in: ['in', 'inArrow', 'Uang masuk'], bill: ['b', 'receipt', 'Pokok bulanan'], harian: ['r', null, 'Harian'], other: ['g', 'bolt', 'Tak terduga'], save: ['s', 'jar', 'Ke tabungan'], withdraw: ['s', 'jar', 'Dari tabungan'], transfer: ['g', 'swap', 'Pindah dompet'], adjust: ['g', 'scale', 'Penyesuaian saldo'] };
function txRow(x) {
  const [cls, ic, label] = TT[x.type] || TT.other;
  const icon = x.type === 'harian' ? catOf(x.cat).icon : x.type === 'other' ? otherIcon(x) : ic;
  let sub = x.type === 'harian' ? catOf(x.cat).name : x.type === 'other' ? otherLabel(x) : label;
  sub += x.type === 'transfer' ? ', ' + walletName(x.wallet) + ' ke ' + walletName(x.toWallet) : ', ' + walletName(x.wallet);
  const sign = x.type === 'in' || x.type === 'withdraw' ? '+' : x.type === 'transfer' ? '' : x.type === 'adjust' ? (x.amount >= 0 ? '+' : '−') : '−';
  return `<button class="row" data-edit="${x.id}"><span class="ico ${cls}">${svg(icon, x.type === 'in' ? 2.4 : 2)}</span>
    <span class="grow"><span class="t1">${esc(x.name)}</span><span class="t2">${esc(sub)}</span></span>
    <span class="amt num ${sign === '+' ? 'pos' : ''}">${sign}${fmt(x.amount)}</span></button>`;
}
const byDate = arr => arr.slice().sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
function groupByDay(arr, extra) {
  const g = {}; byDate(arr).forEach(x => { (g[x.date] = g[x.date] || []).push(x); });
  return Object.keys(g).sort().reverse().map(d => `<div class="day"><span>${dateLabel(d)}</span>${extra ? extra(g[d]) : ''}</div><div class="list">${g[d].map(txRow).join('')}</div>`).join('');
}

        let x;
        if (k === 'out') x = f.pocket === 'harian' ? { type: 'harian', cat: f.cat, name: f.name.trim() || catOf(f.cat).name } : (f.pocket === 'other' ? { type: 'other', name: f.name.trim() || 'Pengeluaran tak terduga' } : { type: 'other', pocket: f.pocket, name: f.name.trim() || (pocketOf(f.pocket) || {}).name || 'Pengeluaran' });
        else if (k === 'in') x = { type: 'in', name: f.name.trim() || 'Uang masuk' };
        else if (k === 'save') { const g = S.goals.find(q => q.id === f.goal); x = { type: f.dir, goal: g.id, name: (f.dir === 'save' ? 'Tabung: ' : 'Ambil: ') + g.name }; }
        else x = { type: 'transfer', toWallet: f.toWallet, name: 'Pindah ke ' + walletName(f.toWallet) };
        Object.assign(x, { amount: f.amount, wallet: f.wallet, date: f.date, month: monthOf(f.date), time: edit ? edit.time : nowTime() });
        if (edit) { const before = Object.assign({}, edit); x.id = edit.id; if (edit.tpl) x.tpl = edit.tpl; put('tx', x); closeSheet(); render(); toast('Catatan diperbarui', () => put('tx', before)); }
        else { x.id = uid('t'); x.createdAt = new Date().toISOString(); put('tx', x); closeSheet(); render(); toast(x.name + ' ' + rp(x.amount) + ' tersimpan', () => del('tx', x.id)); }
      };
      if (edit) root.querySelector('#f-del').onclick = () => { const saved = Object.assign({}, edit); del('tx', edit.id); closeSheet(); render(); toast('Catatan dihapus', () => put('tx', saved)); };
      if (!edit) setTimeout(() => amt.focus(), 60);
    });
  };
  draw();
}

function openBillManager(back) {

  const cm = curMonth(), monthly = list.filter(b => Number(b.freq) === 1), other = list.filter(b => Number(b.freq) !== 1);
  const perMonth = sum(monthly), thisMonth = sum(list.filter(b => billDue(b, cm)));
  const perYearOther = sum(other, b => (Number(b.amount) || 0) * (12 / (Number(b.freq) || 12)));
  const summary = list.length ? `<div class="sum-row"><div class="sum-box"><small>Total per bulan</small><b class="num">${rp(perMonth)}</b><small>${monthly.length} tagihan bulanan</small></div>

    <button class="save" id="f-add">Tambah tagihan</button>`, root => {

  }, back);
}
function openBillForm(id, back) {
  const b = id ? S.bills.find(x => x.id === id) : null, cm = curMonth();
  const f = b ? Object.assign({}, b) : { name: '', amount: 0, variable: false, dueDay: 1, freq: 1, startMonth: cm };
  const firstMonthEditable = !b || (b.createdMonth || cm) === cm;
  f.thisMonth = b ? (b.startMonth || cm) <= cm : null;   // null = ikuti tanggal jatuh tempo
  const months = Array.from({ length: 12 }, (_, i) => shiftM(cm, i));

  const draw = () => openSheet(b ? 'Ubah tagihan' : 'Tambah tagihan', `<div class="field"><label for="f-name">Nama tagihan</label><input id="f-name" class="text" value="${esc(f.name)}" placeholder="Contoh: Internet rumah, STNK motor" autocomplete="off"></div>

    <div class="field"><label for="f-due">Jatuh tempo tanggal</label><select id="f-due" class="sel">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${Number(f.dueDay) === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></div>

    ${Number(f.freq) === 1 && firstMonthEditable ? `<div class="field"><button class="toggle" id="f-this" role="switch" aria-checked="${f.thisMonth === null ? f.dueDay >= dayOf(todayISO()) : f.thisMonth}"><span class="grow"><span class="t1">Tagih mulai bulan ini</span><span class="t2">Matikan kalau tagihan ${mLabel(cm)} sudah dibayar sebelum memakai Arto</span></span><span class="sw"><i></i></span></button></div>` : ''}
    <div class="field" ${Number(f.freq) === 1 ? 'hidden' : ''} id="f-startf"><label for="f-start">Jatuh tempo berikutnya</label><select id="f-start" class="sel">${months.map(mm => `<option value="${mm}" ${mm === f.startMonth ? 'selected' : ''}>${mLabel(mm)}</option>`).join('')}</select></div>
    <p class="err" id="f-err" hidden></p><button class="save" id="f-save">${b ? 'Simpan perubahan' : 'Tambah tagihan'}</button>${b ? '<button class="del" id="f-del">Hapus tagihan</button>' : ''}`, root => {
    const keep = () => { f.name = root.querySelector('#f-name').value; f.dueDay = Number(root.querySelector('#f-due').value); f.startMonth = root.querySelector('#f-start').value; };
    bindMoney(root.querySelector('#f-amt'), v => { f.amount = v; });
    root.querySelector('#f-var').onclick = () => { keep(); f.variable = !f.variable; draw(); };
    const ft = root.querySelector('#f-this'); if (ft) ft.onclick = () => { keep(); f.thisMonth = ft.getAttribute('aria-checked') !== 'true'; draw(); };
    root.querySelector('#f-due').addEventListener('change', () => { if (f.thisMonth === null) { keep(); draw(); } });
    bindChips(root, 'freq', v => { keep(); f.freq = Number(v); if (f.freq === 1) f.startMonth = cm; draw(); });
    root.querySelector('#f-save').onclick = () => {
      keep();
      const err = m => { const e = root.querySelector('#f-err'); e.textContent = m; e.hidden = false; };
      if (!f.name.trim()) return err('Beri nama tagihannya.');
      if (!f.amount && !f.variable) return err('Isi jumlah tagihannya.');
      let start = f.startMonth;
      if (Number(f.freq) === 1) {

      }
      const doc = { id: b ? b.id : uid('b'), name: f.name.trim(), amount: f.amount, variable: !!f.variable, dueDay: f.dueDay, freq: Number(f.freq), startMonth: start, createdMonth: b ? b.createdMonth || cm : cm, active: true };
      put('bills', doc); render(); toast(b ? 'Tagihan diperbarui' : 'Tagihan ' + doc.name + ' ditambahkan'); back ? back() : closeSheet();
    };
    if (b) root.querySelector('#f-del').onclick = () => { const s = Object.assign({}, b); del('bills', b.id); render(); toast('Tagihan dihapus', () => put('bills', s)); back ? back() : closeSheet(); };
  }, back);
  draw();
}

// ================= PIN (per perangkat) =================
const getPin = () => { try { return JSON.parse(localStorage.getItem(PIN_KEY) || 'null'); } catch (e) { return null; } };
async function hashPin(salt, pin) {
  const t = salt + ':' + pin;
  if (window.crypto && crypto.subtle) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) {} }
  let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return 'd' + (h >>> 0).toString(16);
}
const pinState = { mode: 'unlock', entry: '', first: '', fails: 0, until: 0, busy: false };
function drawPin(title, hint, err) {
  const L = $('lock');
  L.innerHTML = `<div class="screen-in" style="justify-content:space-between"><div style="display:flex;justify-content:flex-end;min-height:40px">${pinState.mode !== 'unlock' ? '<button class="link" id="p-cancel">Batal</button>' : ''}</div>
    <div style="text-align:center"><div class="brand" style="margin:0 auto">${svg('lock', 2.2).replace('<svg', '<svg width="28" height="28"')}</div><h1 style="font-size:24px">${title}</h1><p id="p-hint" style="${err ? 'color:var(--red-ink);font-weight:700' : ''}">${hint}</p>
      <div class="pin-dots" id="p-dots">${[0, 1, 2, 3].map(i => `<i class="${pinState.entry.length > i ? 'on' : ''}"></i>`).join('')}</div></div>
    <div><div class="keys">${['1','2','3','4','5','6','7','8','9'].map(k => `<button data-k="${k}">${k}</button>`).join('')}<span></span><button data-k="0">0</button><button class="plain" data-k="del" aria-label="Hapus angka">⌫</button></div>
      ${pinState.mode === 'unlock' ? '<p style="text-align:center;margin-top:18px"><button class="link" id="p-forgot">Lupa PIN?</button></p>' : ''}</div></div>`;
  L.hidden = false;
  L.querySelectorAll('[data-k]').forEach(b => b.onclick = () => pinKey(b.dataset.k));
  const c = $('p-cancel'); if (c) c.onclick = () => { L.hidden = true; };
  const fg = $('p-forgot'); if (fg) fg.onclick = forgotPin;
}
const PIN_TEXT = { unlock: ['Arto terkunci', 'Masukkan PIN'], verify: ['Masukkan PIN lama', 'Untuk melanjutkan'], new1: ['Buat PIN baru', '4 angka yang mudah kamu ingat'], new2: ['Ulangi PIN baru', 'Ketik sekali lagi'], off: ['Masukkan PIN', 'Untuk mematikan PIN'] };
function pinScreen(err) { const [t, h] = PIN_TEXT[pinState.mode]; drawPin(t, err || h, !!err); }
function showLock() { if (!getPin()) return; Object.assign(pinState, { mode: 'unlock', entry: '' }); pinScreen(); }
function startPin(kind) { Object.assign(pinState, { entry: '', first: '', mode: kind === 'new' ? 'new1' : kind === 'off' ? 'off' : 'verify' }); pinScreen(); }
async function pinKey(k) {
  if (pinState.busy) return;
  if (Date.now() < pinState.until) return pinScreen('Tunggu sebentar sebelum mencoba lagi.');
  if (k === 'del') { pinState.entry = pinState.entry.slice(0, -1); return pinScreen(); }
  if (pinState.entry.length >= 4) return;
  pinState.entry += k; pinScreen();
  if (pinState.entry.length < 4) return;
  pinState.busy = true;
  try {
    const pin = pinState.entry, P = getPin();
    if (['unlock', 'verify', 'off'].includes(pinState.mode)) {
      if (!P || (await hashPin(P.salt, pin)) !== P.hash) {
        pinState.entry = ''; pinState.fails++;
        if (pinState.fails >= 5) { pinState.fails = 0; pinState.until = Date.now() + 30000; }
        pinScreen(pinState.until > Date.now() ? 'Terlalu banyak percobaan. Tunggu 30 detik.' : 'PIN salah, coba lagi');
        const d = $('p-dots'); if (d) d.classList.add('shake'); return;
      }
      pinState.fails = 0;
      if (pinState.mode === 'unlock') { $('lock').hidden = true; return; }
      if (pinState.mode === 'off') { localStorage.removeItem(PIN_KEY); $('lock').hidden = true; toast('PIN dimatikan'); return; }
      Object.assign(pinState, { mode: 'new1', entry: '' }); return pinScreen();
    }
    if (pinState.mode === 'new1') { Object.assign(pinState, { first: pin, mode: 'new2', entry: '' }); return pinScreen(); }
    if (pinState.mode === 'new2') {
      if (pin !== pinState.first) { Object.assign(pinState, { mode: 'new1', entry: '', first: '' }); return pinScreen('PIN tidak sama. Silakan buat ulang.'); }
      const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x => x.toString(16).padStart(2, '0')).join('');
      localStorage.setItem(PIN_KEY, JSON.stringify({ salt, hash: await hashPin(salt, pin) }));
      $('lock').hidden = true; toast('PIN terpasang');
    }
  } finally { pinState.busy = false; }
}
function forgotPin() {
  const L = $('lock');
  L.innerHTML = `<div class="screen-in"><h1 style="font-size:26px">Lupa PIN</h1><p>${cloud.user ? 'Masukkan kata sandi akun Arto. Setelah itu PIN dimatikan dan kamu bisa membuat yang baru.' : 'Tanpa akun, PIN tidak bisa dipulihkan.'}</p>

const FIX1_KEY = 'arto_fix_first_month_v1';
function fixFirstMonthBills() {
  try { if (localStorage.getItem(FIX1_KEY) === '1') return; } catch (e) {}
  const cm = curMonth(), today = dayOf(todayISO());
  const list = S.bills.filter(b => Number(b.freq) === 1 && (b.createdMonth || cm) === cm && (b.startMonth || cm) === cm && dueDayIn(b, cm) < today && !billPaid(b, cm));
  list.forEach(b => put('bills', Object.assign({}, b, { startMonth: shiftM(cm, 1) })));
  try { localStorage.setItem(FIX1_KEY, '1'); } catch (e) {}
  if (list.length) { render(); toast(list.length + ' tagihan yang jatuh temponya sudah lewat dimulai bulan depan'); }
}
function stopSync() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; }
function startSync() {
  stopSync(); cloud.ready = false;
  const hasCache = S.wallets.length || S.tx.length || S.bills.length;
  if (hasCache) { render(); hideBoot(); }
  const got = new Set(), need = COLS.length + 1;
  const done = k => { got.add(k); if (got.size >= need && !cloud.ready) { cloud.ready = true; fixFirstMonthBills(); render(); hideBoot(); } };
  const timer = setTimeout(() => { if (!cloud.ready) { cloud.ready = true; render(); hideBoot(); } }, 9000);
  COLS.forEach(col => unsubs.push(db.collection(col).onSnapshot({ includeMetadataChanges: true }, s => {
    if (!(s.empty && s.metadata.fromCache)) S[col] = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    cloud.pending = s.metadata.hasPendingWrites; cache(); done(col); if (cloud.ready) render();
  }, e => { console.error(e); if (e && e.code === 'permission-denied') { toast('Akun ini tidak punya akses ke Arto', null, true); signOut(); } })));
  unsubs.push(db.collection('config').doc('main').onSnapshot(s => {
    if (s.exists) S.config = Object.assign({ limit: 0, planSave: 0 }, s.data());
    cache(); done('config'); if (cloud.ready) { clearTimeout(timer); render(); }
  }, e => console.error(e)));
}
function signOut() { stopSync(); if (auth) auth.signOut(); S = EMPTY(); cache(); render(); toast('Berhasil keluar'); }
try {
  if (window.firebase && firebase.initializeApp) {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth(); db = firebase.firestore();
    const pp = db.enablePersistence({ synchronizeTabs: true }); if (pp && pp.catch) pp.catch(() => {});
    cloud.available = true;
  }
} catch (e) { console.error(e); cloud.available = false; }

// ================= Klik umum =================
document.addEventListener('click', e => {
  if (e.target.closest('#scrim') || e.target.closest('#toast') || e.target.closest('.screen')) return;
  const t = e.target.closest('[data-pocket],[data-go],[data-act],[data-pay],[data-edit],[data-quick],[data-savegoal],[data-withdraw],[data-goaledit],[data-wallet],[data-incok],[data-incedit],[data-f],[data-rm]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) go(d.go);
  else if (d.pay) openPay(d.pay, d.m);
  else if (d.edit) openTx({ id: d.edit });
  else if (d.quick) openTx({ kind: 'out', pocket: 'harian', cat: d.quick });
  else if (d.savegoal) openTx({ kind: 'save', dir: 'save', goal: d.savegoal });
  else if (d.withdraw) openTx({ kind: 'save', dir: 'withdraw', goal: d.withdraw });
  else if (d.goaledit) openGoalForm(d.goaledit);
  else if (d.pocket) openTx({ kind: 'out', pocket: d.pocket });
  else if (d.wallet) openWalletForm(d.wallet);
  else if (d.incok) confirmIncome(d.incok);
  else if (d.incedit) openIncomeConfirm(d.incedit);
  else if (d.f) { filter = d.f; renderRiwayat(); }
  else if (d.rm) { rMonth = d.rm === 'now' ? curMonth() : shiftM(rMonth, Number(d.rm)); renderRiwayat(); }
  else if (d.act === 'wallet-new') openWalletForm(null);
  else if (d.act === 'wallets') openWalletList();
  else if (d.act === 'transfer') { if (S.wallets.length < 2) { toast('Butuh minimal dua dompet untuk pindah uang'); return; } openTx({ kind: 'transfer' }); }
  else if (d.act === 'bills') openBillManager();
  else if (d.act === 'goal-new') openGoalForm(null);
  else if (d.act === 'cat-new') openCatForm(null);
  else if (d.act === 'limit') openNumberSetting('limit', 'Batas Harian', 'Batas jajan dan pengeluaran harian dalam sebulan, termasuk bensin dan belanja dapur.');
  else if (d.act === 'plan') openNumberSetting('planSave', 'Rencana tabungan', 'Sisa rencana yang belum ditabung bulan ini disisihkan dari "Bisa dipakai".');
  else if (d.act === 'share') shareReport();
  else if (d.act === 'mail') mailReport(t);
});
async function mailReport(btn) {
  if (!MAIL_URL || !auth || !auth.currentUser) return;
  const m = rMonth || curMonth();
  btn.disabled = true; const old = btn.innerHTML; btn.textContent = 'Mengirim…';
  try {
    const idToken = await auth.currentUser.getIdToken();
    const r = await fetch(MAIL_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ idToken, month: m }) });
    const out = await r.json(); if (!out || !out.ok) throw new Error((out && out.error) || 'gagal');
    toast('Laporan ' + mLabel(m) + ' terkirim ke email');
  } catch (e) { console.error(e); toast(navigator.onLine === false ? 'Tidak ada koneksi, email belum terkirim' : 'Email gagal terkirim, coba lagi', null, true); }
  finally { btn.disabled = false; btn.innerHTML = old; }
}
async function shareReport() {
  const text = reportText(rMonth || curMonth());
  if (navigator.share) { try { await navigator.share({ title: 'Laporan Arto', text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Laporan disalin'); } catch (e) { toast('Tidak bisa membagikan di perangkat ini', null, true); }
}

async function checkUpdate() {
